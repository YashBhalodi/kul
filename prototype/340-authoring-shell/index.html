<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype 340 — authoring shell</title>
  <!--
    Gallery-then-studio authoring shell. A (workbench) and B (tree stage)
    were discarded. Right pane is always the kinship tree, with drag-to-pan
    and wheel-to-zoom. Left pane is file explorer + editor, each independently
    collapsible. PROTOTYPE — not production. In-memory vault only.
  -->
  <style>
    :root {
      --surface: #f7f9fa;
      --raised: #ffffff;
      --ink: #1a1a1a;
      --muted: #5a6b75;
      --line: #cfd8dc;
      --line-strong: #90a4ae;
      --accent: #1565c0;
      --marriage: #6a1b9a;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--surface); color: var(--ink); }
    body { font-family: var(--font); }
    #app { height: 100%; }
    .proto-banner {
      position: fixed; top: 8px; right: 8px; z-index: 40; pointer-events: none;
      font: 11px/1.2 var(--mono); background: var(--ink); color: #f5d76e;
      padding: 4px 8px; letter-spacing: .04em;
    }
    #state-dump {
      position: fixed; left: 8px; bottom: 16px; z-index: 40;
      max-width: 20rem; max-height: 18vh; overflow: auto;
      background: var(--ink); color: #c8e6c9; font: 11px/1.35 var(--mono);
      padding: 8px 10px; white-space: pre; pointer-events: none; opacity: .88;
    }
    .rail {
      flex: none; width: 220px; display: flex; flex-direction: column;
      background: var(--raised); border-right: 1px solid var(--line); min-width: 0;
    }
    .rail.collapsed { width: 40px; }
    .rail-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; width: 100%; border: 0; background: transparent; color: var(--muted);
      padding: 10px 8px; font: 11px/1.2 var(--mono); letter-spacing: .12em;
      text-transform: uppercase; cursor: pointer; text-align: left; flex: none;
    }
    .rail.collapsed .rail-head { justify-content: center; padding: 10px 0; }
    .rail.collapsed .rail-title { display: none; }
    .rail-head:hover { color: var(--ink); }
    .rail-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .rail-head .icon { display: block; width: 18px; height: 18px; }
    .rail.collapsed .body { display: none; }
    .rail .body { display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: auto; }
    .rail .row, .rail .new {
      display: block; width: calc(100% - 16px); margin: 0 8px; text-align: left;
      border: 0; background: transparent; color: var(--ink); padding: 7px 8px;
      font: 13px/1.3 var(--mono); cursor: pointer; border-radius: 4px;
    }
    .rail .row.on { background: #e3f2fd; color: var(--accent); }
    .rail .row:hover { background: #eceff1; }
    .left-pane {
      display: flex; min-width: 0; min-height: 0;
      flex: 0 0 calc(var(--split, 0.52) * 100%);
    }
    .left-pane.no-editor { flex: none; width: auto; }
    .tree-pane {
      flex: 1 1 0; min-width: 0; overflow: hidden; position: relative;
      background: var(--raised); cursor: grab; touch-action: none;
    }
    .tree-pane.panning { cursor: grabbing; }
    .tree-scene {
      position: absolute; top: 0; left: 0; transform-origin: 0 0;
      will-change: transform;
    }
    .tree-scene img {
      display: block; max-width: none; user-select: none; pointer-events: none;
      -webkit-user-drag: none;
    }
    .tree-controls {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      display: flex; gap: 2px; padding: 4px;
      background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 2px 8px rgba(26,26,26,.12);
    }
    .tree-controls button {
      width: 32px; height: 32px; border: 0; background: transparent;
      color: var(--ink); cursor: pointer; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .tree-controls button:hover { background: #eceff1; }
    .tree-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .tree-controls svg { display: block; width: 16px; height: 16px; }
    .editor-pane {
      flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
      background: var(--raised); border-right: 1px solid var(--line);
    }
    .editor-pane.collapsed { flex: 0 0 40px; width: 40px; }
    .editor-pane.collapsed .body { display: none; }
    .editor-pane.collapsed .rail-title { display: none; }
    .editor-pane.collapsed .rail-head { justify-content: center; padding: 10px 0; }
    .editor-pane .body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .editor-pane textarea {
      flex: 1; resize: none; border: 0; background: var(--raised); color: var(--ink);
      padding: 14px 16px; font: 13px/1.55 var(--mono); outline: none;
    }
    .gutter { width: 5px; cursor: col-resize; background: var(--line); flex: none; }
    .gutter:hover { background: var(--accent); }

    /* ── C Gallery then studio ── */
    [data-shell="C"] { height: 100%; background: var(--surface); color: var(--ink); }
    [data-shell="C"] .gallery { height: 100%; overflow: auto; padding: 56px; }
    [data-shell="C"] .gallery h1 {
      font: 600 40px/1.1 var(--font); margin: 0 0 8px; letter-spacing: -.03em; font-style: normal;
    }
    [data-shell="C"] .gallery p { color: var(--muted); margin: 0 0 32px; }
    [data-shell="C"] .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    [data-shell="C"] .card, [data-shell="C"] .card-new {
      border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink);
      min-height: 140px; padding: 20px; cursor: pointer; text-align: left; font: inherit; border-radius: 2px;
    }
    [data-shell="C"] .card:hover, [data-shell="C"] .card-new:hover {
      border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
    }
    [data-shell="C"] .card b { display: block; font-size: 22px; margin-bottom: 10px; font-weight: 600; font-style: normal; }
    [data-shell="C"] .card small { display: block; font-size: 13px; color: var(--muted); }
    [data-shell="C"] .card-new { border-style: dashed; color: var(--muted); }
    [data-shell="C"] .studio { height: 100%; display: flex; flex-direction: column; }
    [data-shell="C"] .studio-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--raised);
    }
    [data-shell="C"] .studio-bar .back {
      border: 0; background: none; cursor: pointer; font: 13px/1 var(--font);
      color: var(--accent);
    }
    [data-shell="C"] .studio-bar h1 { font: 600 16px/1 var(--font); margin: 0 12px 0 0; font-style: normal; }
    [data-shell="C"] .studio-bar .count { color: var(--muted); font: 12px/1 var(--mono); margin-right: auto; }
    [data-shell="C"] .studio-body { flex: 1; display: flex; min-height: 0; }

    .empty { padding: 16px; color: var(--muted); font: 13px/1.4 var(--font); }
  </style>
</head>
<body>
  <div class="proto-banner">PROTOTYPE 340 — throwaway</div>
  <pre id="state-dump"></pre>
  <div id="app"></div>
  <script>
    const BLANK_KUL = `person someone name:"Someone" gender:other\n`;
    const BLANK_YML = `kul: "0.1"\n`;

    const SEEDS = [
      {
        id: "tanaka",
        name: "Tanaka",
        dir: "/examples/01-nuclear-family",
        files: ["kul.yml", "nuclear-family.kul"],
        tree: "/examples/01-nuclear-family/tree.svg",
      },
      {
        id: "fernandez",
        name: "Fernández",
        dir: "/examples/08-multi-file-project",
        files: ["kul.yml", "01-founders.kul", "02-children.kul", "03-grandchildren.kul"],
        tree: "/examples/08-multi-file-project/tree.svg",
      },
    ];

    const ARCHIVE_FILES = [
      "01-founders", "02-ahmedabad-house", "03-surat-house", "04-first-cousins",
      "05-second-cousins", "06-marriages-1950s", "07-marriages-1970s", "08-adoptions",
      "09-ended-marriages", "10-nairobi-branch", "11-london-branch", "12-toronto-branch",
      "13-children-gen3", "14-children-gen4", "15-in-laws", "16-step-kin",
      "17-notes-dates", "18-notes-names", "19-unplaced", "20-widows",
      "21-polygamy-hub", "22-ghosts", "23-far-cousins", "24-living",
    ];

    function buildArchive() {
      const files = { "kul.yml": BLANK_YML };
      ARCHIVE_FILES.forEach((slug, i) => {
        const n = i + 1;
        const a = `p${n}a`;
        const b = `p${n}b`;
        const m = `m_${n}`;
        files[`${slug}.kul`] = [
          `# ${slug}.kul — Patel archive (synthetic; prototype chrome only)`,
          `person ${a} name:"Person ${n}a" gender:male born:${1910 + n}`,
          `person ${b} name:"Person ${n}b" gender:female born:${1912 + n}`,
          `marriage ${m} ${a} ${b} start:${1935 + n}`,
          "",
        ].join("\n");
      });
      return {
        id: "patel",
        name: "Patel archive",
        files,
        tree: "/examples/09-family-across-a-century/tree.svg",
      };
    }

    function kulCount(p) {
      return Object.keys(p.files).filter((n) => n.endsWith(".kul")).length;
    }

    function kulLabel(p) {
      const n = kulCount(p);
      return n === 1 ? "1 .kul file" : `${n} .kul files`;
    }

    const state = {
      projects: [],
      openProjectId: null,
      openFile: null,
      split: 0.52,
      screen: "gallery",
      filesOpen: true,
      editorOpen: true,
      view: { x: 0, y: 0, zoom: 1, fittedFor: null },
    };

    function dump() {
      const open = state.projects.find((p) => p.id === state.openProjectId);
      document.getElementById("state-dump").textContent = JSON.stringify({
        shelf: state.projects.map((p) => p.id),
        openProjectId: state.openProjectId,
        openFile: state.openFile,
        files: open ? Object.keys(open.files) : [],
        split: Number(state.split.toFixed(2)),
        screen: state.screen,
        filesOpen: state.filesOpen,
        editorOpen: state.editorOpen,
        view: {
          x: Math.round(state.view.x),
          y: Math.round(state.view.y),
          zoom: Number(state.view.zoom.toFixed(2)),
          fittedFor: state.view.fittedFor,
        },
      }, null, 2);
    }

    function openProject(id) {
      const p = state.projects.find((x) => x.id === id);
      if (!p) return;
      state.openProjectId = id;
      state.screen = "studio";
      state.view.fittedFor = null;
      const names = Object.keys(p.files);
      state.openFile = names.find((n) => n.endsWith(".kul")) || names[0] || null;
      render();
    }

    function openFile(name) {
      state.openFile = name;
      render();
    }

    function createProject() {
      const n = state.projects.filter((p) => p.id.startsWith("untitled")).length + 1;
      const id = `untitled-${n}`;
      state.projects.push({
        id,
        name: `Untitled ${n}`,
        files: { "kul.yml": BLANK_YML, "family.kul": BLANK_KUL },
        tree: null,
      });
      openProject(id);
    }

    function writeFile(value) {
      const p = state.projects.find((x) => x.id === state.openProjectId);
      if (!p || !state.openFile) return;
      p.files[state.openFile] = value;
      dump();
    }

    function fileNames(p) {
      return Object.keys(p.files).sort((a, b) => {
        if (a === "kul.yml") return -1;
        if (b === "kul.yml") return 1;
        return a.localeCompare(b);
      });
    }

    const ICON_PLUS = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    const ICON_MINUS = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    const ICON_RESET = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6V3.5A.5.5 0 0 1 3.5 3H6M10 3h2.5a.5.5 0 0 1 .5.5V6M13 10v2.5a.5.5 0 0 1-.5.5H10M6 13H3.5a.5.5 0 0 1-.5-.5V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    function treeHtml(p) {
      if (!p || !p.tree) return `<div class="empty">No tree in this prototype — new Kul projects have no committed SVG.</div>`;
      return `
        <div class="tree-scene"><img alt="Kinship tree for ${p.name}" src="${p.tree}" draggable="false" /></div>
        <div class="tree-controls" role="group" aria-label="Diagram view">
          <button type="button" data-view="in" title="Zoom in" aria-label="Zoom in">${ICON_PLUS}</button>
          <button type="button" data-view="reset" title="Reset view" aria-label="Reset view">${ICON_RESET}</button>
          <button type="button" data-view="out" title="Zoom out" aria-label="Zoom out">${ICON_MINUS}</button>
        </div>`;
    }

    function bindTreeView(root) {
      const pane = root.querySelector(".tree-pane");
      const scene = root.querySelector(".tree-scene");
      if (!pane || !scene) return;
      const img = scene.querySelector("img");
      if (!img) return;

      function apply() {
        scene.style.transform = `translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.zoom})`;
        dump();
      }

      function fit() {
        if (!img.naturalWidth) return;
        const pad = 40;
        const z = Math.min(
          (pane.clientWidth - pad) / img.naturalWidth,
          (pane.clientHeight - pad) / img.naturalHeight,
        );
        state.view.zoom = z;
        state.view.x = (pane.clientWidth - img.naturalWidth * z) / 2;
        state.view.y = (pane.clientHeight - img.naturalHeight * z) / 2;
        state.view.fittedFor = state.openProjectId;
        apply();
      }

      function zoomAt(cx, cy, next) {
        const z = Math.min(6, Math.max(0.12, next));
        const k = z / state.view.zoom;
        state.view.x = cx - (cx - state.view.x) * k;
        state.view.y = cy - (cy - state.view.y) * k;
        state.view.zoom = z;
        apply();
      }

      if (state.view.fittedFor !== state.openProjectId) {
        if (img.complete && img.naturalWidth) fit();
        else img.addEventListener("load", fit, { once: true });
      } else {
        apply();
      }

      pane.addEventListener("wheel", (e) => {
        e.preventDefault();
        const r = pane.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, state.view.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
      }, { passive: false });

      pane.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || e.target.closest(".tree-controls")) return;
        try { pane.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events */ }
        pane.classList.add("panning");
        let lastX = e.clientX;
        let lastY = e.clientY;
        const move = (ev) => {
          state.view.x += ev.clientX - lastX;
          state.view.y += ev.clientY - lastY;
          lastX = ev.clientX;
          lastY = ev.clientY;
          apply();
        };
        const up = () => {
          pane.classList.remove("panning");
          pane.removeEventListener("pointermove", move);
          pane.removeEventListener("pointerup", up);
        };
        pane.addEventListener("pointermove", move);
        pane.addEventListener("pointerup", up);
      });

      pane.addEventListener("dblclick", (e) => {
        if (e.target.closest(".tree-controls")) return;
        fit();
      });

      pane.querySelectorAll("[data-view]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const r = pane.getBoundingClientRect();
          const cx = r.width / 2;
          const cy = r.height / 2;
          if (btn.dataset.view === "in") zoomAt(cx, cy, state.view.zoom * 1.25);
          else if (btn.dataset.view === "out") zoomAt(cx, cy, state.view.zoom / 1.25);
          else fit();
        });
      });
    }

    function editorValue(p) {
      if (!p || !state.openFile) return "";
      return p.files[state.openFile] ?? "";
    }

    function bindEditor(root) {
      const ta = root.querySelector("textarea");
      if (ta) ta.addEventListener("input", (e) => writeFile(e.target.value));
    }

    function bindColSplit(gutter, getPane) {
      gutter.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const pane = getPane();
        const startX = e.clientX;
        const start = state.split;
        const width = pane.getBoundingClientRect().width;
        const move = (ev) => {
          state.split = Math.min(0.8, Math.max(0.2, start + (ev.clientX - startX) / width));
          pane.style.setProperty("--split", String(state.split));
          dump();
        };
        const up = () => {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
          render();
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });
    }

    const SIDEBAR_ICON = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M9 4.5v15" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>`;

    function rail(kind, title, body) {
      const open = state.filesOpen;
      const action = open ? "Collapse" : "Expand";
      return `
        <aside class="rail ${open ? "" : "collapsed"}" data-rail="${kind}">
          <button type="button" class="rail-head" data-toggle="${kind}" aria-expanded="${open}" aria-label="${action} ${title}">
            <span class="rail-title">${title}</span>
            ${SIDEBAR_ICON}
          </button>
          <div class="body">${body}</div>
        </aside>`;
    }

    function editorPane(p) {
      const open = state.editorOpen;
      const title = state.openFile ?? "Editor";
      const action = open ? "Collapse" : "Expand";
      return `
        <section class="editor-pane ${open ? "" : "collapsed"}">
          <button type="button" class="rail-head" data-toggle="editor" aria-expanded="${open}" aria-label="${action} editor">
            <span class="rail-title">${title}</span>
            ${SIDEBAR_ICON}
          </button>
          <div class="body">
            <textarea spellcheck="false">${escapeHtml(editorValue(p))}</textarea>
          </div>
        </section>`;
    }

    function bindToggles(root) {
      root.querySelectorAll("[data-toggle]").forEach((el) => {
        el.addEventListener("click", () => {
          const key = el.dataset.toggle;
          if (key === "files") state.filesOpen = !state.filesOpen;
          else if (key === "editor") state.editorOpen = !state.editorOpen;
          render();
        });
      });
    }

    function filesBody(p) {
      return p
        ? fileNames(p).map((f) =>
            `<button type="button" class="row ${f === state.openFile ? "on" : ""}" data-file="${f}">${f}</button>`
          ).join("")
        : `<div class="empty">Open a Kul project.</div>`;
    }

    function renderC() {
      const p = state.projects.find((x) => x.id === state.openProjectId);
      const app = document.getElementById("app");
      if (state.screen !== "studio") {
        app.innerHTML = `
          <div data-shell="C">
            <div class="gallery">
              <h1>Shelf</h1>
              <p>One Kul project at a time. The vault is fake — in memory only.</p>
              <div class="cards">
                ${state.projects.map((proj) =>
                  `<button type="button" class="card" data-open="${proj.id}"><b>${proj.name}</b><small>${kulLabel(proj)}</small></button>`
                ).join("")}
                <button type="button" class="card-new" data-create>New Kul project</button>
              </div>
            </div>
          </div>`;
        app.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => openProject(el.dataset.open)));
        app.querySelector("[data-create]").addEventListener("click", createProject);
        return;
      }
      app.innerHTML = `
        <div data-shell="C">
          <div class="studio">
            <div class="studio-bar">
              <button type="button" class="back" data-back>← Shelf</button>
              <h1>${p ? p.name : ""}</h1>
              <span class="count">${p ? kulLabel(p) : ""}</span>
            </div>
            <div class="studio-body" style="--split:${state.split}">
              <div class="left-pane ${state.editorOpen ? "" : "no-editor"}">
                ${rail("files", "Files", filesBody(p))}
                ${editorPane(p)}
              </div>
              <div class="gutter" data-gutter></div>
              <section class="tree-pane">${treeHtml(p)}</section>
            </div>
          </div>
        </div>`;
      bindEditor(app);
      app.querySelector("[data-back]").addEventListener("click", () => { state.screen = "gallery"; render(); });
      app.querySelectorAll("[data-file]").forEach((el) => el.addEventListener("click", () => openFile(el.dataset.file)));
      bindToggles(app);
      bindColSplit(app.querySelector("[data-gutter]"), () => app.querySelector(".studio-body"));
      bindTreeView(app);
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      renderC();
      dump();
    }

    async function loadSeeds() {
      const projects = [];
      for (const seed of SEEDS) {
        const files = {};
        for (const name of seed.files) {
          const res = await fetch(`${seed.dir}/${name}`);
          files[name] = res.ok ? await res.text() : `# missing ${name}\n`;
        }
        projects.push({ id: seed.id, name: seed.name, files, tree: seed.tree });
      }
      state.projects = [...projects, buildArchive()];
      const first = projects[0];
      state.openProjectId = first.id;
      state.openFile = Object.keys(first.files).find((n) => n.endsWith(".kul")) || "kul.yml";
      state.screen = "gallery";
      render();
    }

    loadSeeds();
  </script>
</body>
</html>
