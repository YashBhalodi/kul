<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototype 340 — authoring shell</title>
  <!--
    Two variants of the browser authoring shell, switchable via ?variant=.
    B (tree stage) was discarded. Workbench has two independently collapsible
    left rails: Shelf and Files.
    PROTOTYPE — not production. In-memory vault only.
  -->
  <style>
    :root {
      --surface: #f7f9fa;
      --raised: #ffffff;
      --ink: #1a1a1a;
      --muted: #5a6b75;
      --line: #cfd8dc;
      --line-strong: #90a4ae;
      --accent: #1565c0;
      --marriage: #6a1b9a;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--surface); color: var(--ink); }
    body { font-family: var(--font); }
    #app { height: 100%; }
    .proto-banner {
      position: fixed; top: 8px; right: 8px; z-index: 40; pointer-events: none;
      font: 11px/1.2 var(--mono); background: var(--ink); color: #f5d76e;
      padding: 4px 8px; letter-spacing: .04em;
    }
    #state-dump {
      position: fixed; left: 8px; bottom: 64px; z-index: 40;
      max-width: 20rem; max-height: 18vh; overflow: auto;
      background: var(--ink); color: #c8e6c9; font: 11px/1.35 var(--mono);
      padding: 8px 10px; white-space: pre; pointer-events: none; opacity: .88;
    }
    #switcher {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 10px;
      background: var(--ink); color: var(--raised); border-radius: 999px;
      padding: 8px 14px; box-shadow: 0 8px 24px rgba(26,26,26,.18);
      font: 13px/1 var(--font);
    }
    #switcher button {
      background: var(--raised); color: var(--ink); border: 0; width: 28px; height: 28px;
      border-radius: 50%; cursor: pointer; font-size: 16px;
    }
    #switcher strong { min-width: 14rem; text-align: center; font-weight: 600; }

    /* ── A Workbench ── */
    [data-shell="A"] { display: flex; height: 100%; background: var(--surface); }
    [data-shell="A"] .rail {
      flex: none; width: 200px; display: flex; flex-direction: column;
      background: var(--raised); border-right: 1px solid var(--line); min-width: 0;
    }
    [data-shell="A"] .rail.collapsed { width: 32px; }
    [data-shell="A"] .rail-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; width: 100%; border: 0; background: transparent; color: var(--muted);
      padding: 28px 12px 8px; font: 11px/1.2 var(--mono); letter-spacing: .12em;
      text-transform: uppercase; cursor: pointer; text-align: left;
    }
    [data-shell="A"] .rail.collapsed .rail-head {
      writing-mode: vertical-rl; transform: rotate(180deg);
      padding: 12px 8px; height: 100%; justify-content: flex-start; letter-spacing: .16em;
    }
    [data-shell="A"] .rail-head:hover { color: var(--ink); }
    [data-shell="A"] .rail-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    [data-shell="A"] .rail-head .chev { font-size: 10px; }
    [data-shell="A"] .rail.collapsed .body { display: none; }
    [data-shell="A"] .rail .body { display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: auto; }
    [data-shell="A"] .rail .row, [data-shell="A"] .rail .new {
      display: block; width: calc(100% - 16px); margin: 0 8px; text-align: left;
      border: 0; background: transparent; color: var(--ink); padding: 7px 8px;
      font: 13px/1.3 var(--font); cursor: pointer; border-radius: 4px;
    }
    [data-shell="A"] .rail .row.on { background: #e3f2fd; color: var(--accent); }
    [data-shell="A"] .rail .row:hover { background: #eceff1; }
    [data-shell="A"] .rail .new {
      margin: 8px; width: calc(100% - 16px); border: 1px dashed var(--line-strong); color: var(--muted);
    }
    [data-shell="A"] .rail .new:hover { border-color: var(--accent); color: var(--accent); }
    [data-shell="A"] .stage { flex: 1; display: flex; min-width: 0; }
    [data-shell="A"] .editor, [data-shell="A"] .tree { min-width: 0; display: flex; flex-direction: column; }
    [data-shell="A"] .editor { flex: var(--split, 0.52) 1 0; background: var(--raised); }
    [data-shell="A"] .tree { flex: calc(1 - var(--split, 0.52)) 1 0; background: var(--raised); }
    [data-shell="A"] .tab {
      padding: 10px 14px; font: 12px/1 var(--mono); color: var(--muted);
      border-bottom: 1px solid var(--line); background: var(--surface);
    }
    [data-shell="A"] textarea {
      flex: 1; resize: none; border: 0; background: var(--raised); color: var(--ink);
      padding: 14px 16px; font: 13px/1.55 var(--mono); outline: none;
    }
    [data-shell="A"] .gutter { width: 5px; cursor: col-resize; background: var(--line); }
    [data-shell="A"] .gutter:hover { background: var(--accent); }
    [data-shell="A"] .tree-frame { flex: 1; overflow: auto; padding: 20px; background: var(--raised); }
    [data-shell="A"] .tree-frame img { display: block; margin: 0 auto; }

    /* ── C Gallery then studio ── */
    [data-shell="C"] { height: 100%; background: var(--surface); color: var(--ink); }
    [data-shell="C"] .gallery { height: 100%; overflow: auto; padding: 56px 56px 96px; }
    [data-shell="C"] .gallery h1 {
      font: 600 40px/1.1 var(--font); margin: 0 0 8px; letter-spacing: -.03em; font-style: normal;
    }
    [data-shell="C"] .gallery p { color: var(--muted); margin: 0 0 32px; }
    [data-shell="C"] .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    [data-shell="C"] .card, [data-shell="C"] .card-new {
      border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink);
      min-height: 140px; padding: 20px; cursor: pointer; text-align: left; font: inherit; border-radius: 2px;
    }
    [data-shell="C"] .card:hover, [data-shell="C"] .card-new:hover {
      border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
    }
    [data-shell="C"] .card b { display: block; font-size: 22px; margin-bottom: 10px; font-weight: 600; font-style: normal; }
    [data-shell="C"] .card small { display: block; font-size: 13px; color: var(--muted); }
    [data-shell="C"] .card-new { border-style: dashed; color: var(--muted); }
    [data-shell="C"] .studio { height: 100%; display: flex; flex-direction: column; }
    [data-shell="C"] .studio-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--raised);
    }
    [data-shell="C"] .studio-bar .back {
      border: 0; background: none; cursor: pointer; font: 13px/1 var(--font);
      color: var(--accent);
    }
    [data-shell="C"] .studio-bar h1 { font: 600 16px/1 var(--font); margin: 0 12px 0 0; font-style: normal; }
    [data-shell="C"] .studio-bar .count { color: var(--muted); font: 12px/1 var(--mono); margin-right: auto; }
    [data-shell="C"] .tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--line);
      padding: 0 8px; background: var(--surface);
      overflow-x: auto; flex-wrap: nowrap;
    }
    [data-shell="C"] .tabs button {
      border: 0; background: none; padding: 10px 12px; cursor: pointer;
      font: 12px/1 var(--mono); color: var(--muted); border-bottom: 2px solid transparent;
      white-space: nowrap; flex: none;
    }
    [data-shell="C"] .tabs button.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
    [data-shell="C"] .studio-split { flex: 1; display: flex; min-height: 0; }
    [data-shell="C"] .studio-split .editor { flex: var(--split, 0.52) 1 0; display: flex; flex-direction: column; min-width: 0; background: var(--raised); }
    [data-shell="C"] .studio-split textarea {
      flex: 1; border: 0; resize: none; padding: 16px;
      font: 13px/1.55 var(--mono); outline: none; background: var(--raised); color: var(--ink);
    }
    [data-shell="C"] .studio-gutter { width: 5px; cursor: col-resize; background: var(--line); }
    [data-shell="C"] .studio-gutter:hover { background: var(--accent); }
    [data-shell="C"] .studio-split .tree { flex: calc(1 - var(--split, 0.52)) 1 0; overflow: auto; background: var(--raised); min-width: 0; }
    [data-shell="C"] .studio-split .tree img { display: block; margin: 24px auto; }

    .empty { padding: 16px; color: var(--muted); font: 13px/1.4 var(--font); }
  </style>
</head>
<body>
  <div class="proto-banner">PROTOTYPE 340 — throwaway</div>
  <pre id="state-dump"></pre>
  <div id="app"></div>
  <div id="switcher">
    <button type="button" data-dir="-1" aria-label="Previous variant">←</button>
    <strong id="switcher-label"></strong>
    <button type="button" data-dir="1" aria-label="Next variant">→</button>
  </div>
  <script>
    const VARIANTS = {
      A: "A — Workbench",
      C: "C — Gallery then studio",
    };

    const BLANK_KUL = `person someone name:"Someone" gender:other\n`;
    const BLANK_YML = `kul: "0.1"\n`;

    const SEEDS = [
      {
        id: "tanaka",
        name: "Tanaka",
        dir: "/examples/01-nuclear-family",
        files: ["kul.yml", "nuclear-family.kul"],
        tree: "/examples/01-nuclear-family/tree.svg",
      },
      {
        id: "fernandez",
        name: "Fernández",
        dir: "/examples/08-multi-file-project",
        files: ["kul.yml", "01-founders.kul", "02-children.kul", "03-grandchildren.kul"],
        tree: "/examples/08-multi-file-project/tree.svg",
      },
    ];

    const ARCHIVE_FILES = [
      "01-founders", "02-ahmedabad-house", "03-surat-house", "04-first-cousins",
      "05-second-cousins", "06-marriages-1950s", "07-marriages-1970s", "08-adoptions",
      "09-ended-marriages", "10-nairobi-branch", "11-london-branch", "12-toronto-branch",
      "13-children-gen3", "14-children-gen4", "15-in-laws", "16-step-kin",
      "17-notes-dates", "18-notes-names", "19-unplaced", "20-widows",
      "21-polygamy-hub", "22-ghosts", "23-far-cousins", "24-living",
    ];

    function buildArchive() {
      const files = { "kul.yml": BLANK_YML };
      ARCHIVE_FILES.forEach((slug, i) => {
        const n = i + 1;
        const a = `p${n}a`;
        const b = `p${n}b`;
        const m = `m_${n}`;
        files[`${slug}.kul`] = [
          `# ${slug}.kul — Patel archive (synthetic; prototype chrome only)`,
          `person ${a} name:"Person ${n}a" gender:male born:${1910 + n}`,
          `person ${b} name:"Person ${n}b" gender:female born:${1912 + n}`,
          `marriage ${m} ${a} ${b} start:${1935 + n}`,
          "",
        ].join("\n");
      });
      return {
        id: "patel",
        name: "Patel archive",
        files,
        tree: "/examples/09-family-across-a-century/tree.svg",
      };
    }

    function kulCount(p) {
      return Object.keys(p.files).filter((n) => n.endsWith(".kul")).length;
    }

    function kulLabel(p) {
      const n = kulCount(p);
      return n === 1 ? "1 .kul file" : `${n} .kul files`;
    }

    const state = {
      projects: [],
      openProjectId: null,
      openFile: null,
      split: 0.52,
      screen: "gallery",
      shelfOpen: true,
      filesOpen: true,
    };

    function variant() {
      const raw = new URLSearchParams(location.search).get("variant") || "A";
      if (raw === "B") return "A";
      return VARIANTS[raw] ? raw : "A";
    }

    function setVariant(next) {
      const url = new URL(location.href);
      url.searchParams.set("variant", next);
      history.replaceState(null, "", url);
      render();
    }

    function dump() {
      const open = state.projects.find((p) => p.id === state.openProjectId);
      document.getElementById("state-dump").textContent = JSON.stringify({
        variant: variant(),
        shelf: state.projects.map((p) => p.id),
        openProjectId: state.openProjectId,
        openFile: state.openFile,
        files: open ? Object.keys(open.files) : [],
        split: Number(state.split.toFixed(2)),
        screen: state.screen,
        shelfOpen: state.shelfOpen,
        filesOpen: state.filesOpen,
      }, null, 2);
    }

    function openProject(id) {
      const p = state.projects.find((x) => x.id === id);
      if (!p) return;
      state.openProjectId = id;
      state.screen = "studio";
      const names = Object.keys(p.files);
      state.openFile = names.find((n) => n.endsWith(".kul")) || names[0] || null;
      render();
    }

    function openFile(name) {
      state.openFile = name;
      render();
    }

    function createProject() {
      const n = state.projects.filter((p) => p.id.startsWith("untitled")).length + 1;
      const id = `untitled-${n}`;
      state.projects.push({
        id,
        name: `Untitled ${n}`,
        files: { "kul.yml": BLANK_YML, "family.kul": BLANK_KUL },
        tree: null,
      });
      openProject(id);
    }

    function writeFile(value) {
      const p = state.projects.find((x) => x.id === state.openProjectId);
      if (!p || !state.openFile) return;
      p.files[state.openFile] = value;
      dump();
    }

    function fileNames(p) {
      return Object.keys(p.files).sort((a, b) => {
        if (a === "kul.yml") return -1;
        if (b === "kul.yml") return 1;
        return a.localeCompare(b);
      });
    }

    function treeHtml(p) {
      if (!p || !p.tree) return `<div class="empty">No tree in this prototype — new Kul projects have no committed SVG.</div>`;
      return `<img alt="Kinship tree for ${p.name}" src="${p.tree}" />`;
    }

    function editorValue(p) {
      if (!p || !state.openFile) return "";
      return p.files[state.openFile] ?? "";
    }

    function bindEditor(root) {
      const ta = root.querySelector("textarea");
      if (ta) ta.addEventListener("input", (e) => writeFile(e.target.value));
    }

    function bindColSplit(gutter, getPane) {
      gutter.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const pane = getPane();
        const startX = e.clientX;
        const start = state.split;
        const width = pane.getBoundingClientRect().width;
        const move = (ev) => {
          state.split = Math.min(0.8, Math.max(0.2, start + (ev.clientX - startX) / width));
          pane.style.setProperty("--split", String(state.split));
          dump();
        };
        const up = () => {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
          render();
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });
    }

    function rail(kind, title, body) {
      const open = kind === "shelf" ? state.shelfOpen : state.filesOpen;
      return `
        <aside class="rail ${open ? "" : "collapsed"}" data-rail="${kind}">
          <button type="button" class="rail-head" data-toggle="${kind}" aria-expanded="${open}">
            <span>${title}</span>
            <span class="chev">${open ? "▾" : "▸"}</span>
          </button>
          <div class="body">${body}</div>
        </aside>`;
    }

    function renderA() {
      const p = state.projects.find((x) => x.id === state.openProjectId);
      const app = document.getElementById("app");
      const shelfBody = `
        ${state.projects.map((proj) =>
          `<button type="button" class="row ${proj.id === state.openProjectId ? "on" : ""}" data-open="${proj.id}">${proj.name}</button>`
        ).join("")}
        <button type="button" class="new" data-create>New Kul project</button>`;
      const filesBody = p
        ? fileNames(p).map((f) =>
            `<button type="button" class="row ${f === state.openFile ? "on" : ""}" data-file="${f}">${f}</button>`
          ).join("")
        : `<div class="empty">Open a Kul project.</div>`;
      app.innerHTML = `
        <div data-shell="A">
          ${rail("shelf", "Shelf", shelfBody)}
          ${rail("files", "Files", filesBody)}
          <div class="stage" style="--split:${state.split}">
            <section class="editor">
              <div class="tab">${state.openFile ?? "—"}</div>
              <textarea spellcheck="false">${escapeHtml(editorValue(p))}</textarea>
            </section>
            <div class="gutter" data-gutter></div>
            <section class="tree">
              <div class="tab">tree</div>
              <div class="tree-frame">${treeHtml(p)}</div>
            </section>
          </div>
        </div>`;
      bindEditor(app);
      app.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => openProject(el.dataset.open)));
      app.querySelectorAll("[data-file]").forEach((el) => el.addEventListener("click", () => openFile(el.dataset.file)));
      const create = app.querySelector("[data-create]");
      if (create) create.addEventListener("click", createProject);
      app.querySelectorAll("[data-toggle]").forEach((el) => {
        el.addEventListener("click", () => {
          if (el.dataset.toggle === "shelf") state.shelfOpen = !state.shelfOpen;
          else state.filesOpen = !state.filesOpen;
          render();
        });
      });
      bindColSplit(app.querySelector("[data-gutter]"), () => app.querySelector(".stage"));
    }

    function renderC() {
      const p = state.projects.find((x) => x.id === state.openProjectId);
      const app = document.getElementById("app");
      if (state.screen !== "studio") {
        app.innerHTML = `
          <div data-shell="C">
            <div class="gallery">
              <h1>Shelf</h1>
              <p>One Kul project at a time. The vault is fake — in memory only.</p>
              <div class="cards">
                ${state.projects.map((proj) =>
                  `<button type="button" class="card" data-open="${proj.id}"><b>${proj.name}</b><small>${kulLabel(proj)}</small></button>`
                ).join("")}
                <button type="button" class="card-new" data-create>New Kul project</button>
              </div>
            </div>
          </div>`;
        app.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => openProject(el.dataset.open)));
        app.querySelector("[data-create]").addEventListener("click", createProject);
        return;
      }
      app.innerHTML = `
        <div data-shell="C">
          <div class="studio">
            <div class="studio-bar">
              <button type="button" class="back" data-back>← Shelf</button>
              <h1>${p ? p.name : ""}</h1>
              <span class="count">${p ? kulLabel(p) : ""}</span>
            </div>
            <div class="tabs">
              ${p ? fileNames(p).map((f) =>
                `<button type="button" class="${f === state.openFile ? "on" : ""}" data-file="${f}">${f}</button>`
              ).join("") : ""}
            </div>
            <div class="studio-split" style="--split:${state.split}">
              <section class="editor">
                <textarea spellcheck="false">${escapeHtml(editorValue(p))}</textarea>
              </section>
              <div class="studio-gutter" data-gutter></div>
              <section class="tree">${treeHtml(p)}</section>
            </div>
          </div>
        </div>`;
      bindEditor(app);
      app.querySelector("[data-back]").addEventListener("click", () => { state.screen = "gallery"; render(); });
      app.querySelectorAll("[data-file]").forEach((el) => el.addEventListener("click", () => openFile(el.dataset.file)));
      bindColSplit(app.querySelector("[data-gutter]"), () => app.querySelector(".studio-split"));
      const on = app.querySelector(".tabs button.on");
      if (on) on.scrollIntoView({ inline: "nearest", block: "nearest" });
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      const v = variant();
      document.getElementById("switcher-label").textContent = VARIANTS[v];
      if (v === "C") renderC();
      else renderA();
      dump();
    }

    async function loadSeeds() {
      const projects = [];
      for (const seed of SEEDS) {
        const files = {};
        for (const name of seed.files) {
          const res = await fetch(`${seed.dir}/${name}`);
          files[name] = res.ok ? await res.text() : `# missing ${name}\n`;
        }
        projects.push({ id: seed.id, name: seed.name, files, tree: seed.tree });
      }
      state.projects = [...projects, buildArchive()];
      const first = projects[0];
      state.openProjectId = first.id;
      state.openFile = Object.keys(first.files).find((n) => n.endsWith(".kul")) || "kul.yml";
      state.screen = "gallery";
      render();
    }

    document.getElementById("switcher").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-dir]");
      if (!btn) return;
      const keys = Object.keys(VARIANTS);
      const i = keys.indexOf(variant());
      const next = keys[(i + Number(btn.dataset.dir) + keys.length) % keys.length];
      setVariant(next);
    });

    window.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) return;
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const keys = Object.keys(VARIANTS);
      const i = keys.indexOf(variant());
      setVariant(keys[(i + (e.key === "ArrowRight" ? 1 : -1) + keys.length) % keys.length]);
    });

    loadSeeds();
  </script>
</body>
</html>
