name: Web

# The web app's gates and the workflow lint, through the same `just` recipes
# `just check` and `just verify` run locally. The web recipes skip with a
# message while apps/web has no package.json.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (check, build, e2e, shots, lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: web
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: wasm-pack@0.13.1,just
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: just web-check web-build
      - run: just e2e shots lighthouse
      - name: Upload the screenshot tour
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shots
          path: apps/web/test-results/shots/
          if-no-files-found: ignore

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: just
      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: just lint-workflows
