name: VSCode Extension

# Per-PR sanity check on the extension manifest, grammar, and TypeScript
# build. The actual marketplace publish lives in `release.yml` and runs
# on `v*` tag push as part of the unified release pipeline.
#
# The extension is one workspace member; the webview chrome lives in
# `@kullang/preview` (`packages/preview/`). Changes in either trigger the
# job, and the install is workspace-root so npm understands `workspace:*`.

#
# Packaging also needs `wasm-pack`: the preview's query engine is a build
# asset built from `crates/kul-wasm` and staged into media/preview/wasm/
# (ADR-0040), not an npm dependency. `npm ci` is unaffected — the wasm build
# runs only before `vsce package`.

on:
  push:
    branches: [main]
    paths:
      - 'editor/vscode/**'
      - 'packages/preview/**'
      - 'crates/kul-wasm/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'editor/vscode/**'
      - 'packages/preview/**'
      - 'crates/kul-wasm/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vscode-extension.yml'

jobs:
  lint:
    name: Lint manifest and grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install vsce
        run: npm install -g @vscode/vsce
      # Install at the workspace root so npm resolves @kullang/preview's
      # `workspace:*` link; running `npm ci` inside editor/vscode/ fails
      # with EUNSUPPORTEDPROTOCOL because the workspace context is missing.
      - name: Install workspace dependencies
        run: npm ci
      - name: Run preview package tests (Vitest + jsdom)
        working-directory: packages/preview
        run: npm test
      - name: Run extension unit tests (Vitest)
        working-directory: editor/vscode
        run: npm test
      - name: Validate JSON files parse
        run: |
          set -e
          for f in $(find editor/vscode -type f -name '*.json' -not -path '*/node_modules/*' -not -path '*/media/preview/*'); do
            echo "validating $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
      # The preview's query engine (ADR-0034) runs in the webview and ships as
      # a build asset rather than an npm dependency (ADR-0040), so packaging —
      # and only packaging — needs a wasm toolchain.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: vscode-extension-wasm
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: wasm-pack@0.13.1
      - name: Build the webview query engine (wasm-pack --target web)
        run: wasm-pack build crates/kul-wasm --target web --out-dir pkg-web --out-name kul_wasm
      # `npm run package` builds @kullang/preview, copies dist/ and the engine
      # asset into editor/vscode/media/preview/, and runs
      # `vsce package --no-dependencies` (the workspace: protocol is not a real
      # npm registry resolution, so the vsce dependency walker would reject it —
      # the bundled out/extension.js already inlines every runtime symbol the
      # extension needs).
      - name: Validate manifest with vsce package
        working-directory: editor/vscode
        run: npm run package -- --out /tmp/kul-test.vsix
