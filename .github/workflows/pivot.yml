name: Pivot harness

# Epic #343: the behaviour diff against the pinned pre-pivot commit and the
# old-name search, through the same `just` recipes `just verify` runs. This
# workflow is deleted with scripts/pivot/ when the epic completes.

on:
  pull_request:

jobs:
  baseline:
    name: baseline diff and old-name search
    runs-on: ubuntu-latest
    steps:
      # Full history: the baseline builds the pinned commit in a worktree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: pivot
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: just
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: just baseline-diff
      - run: just vestige-check
