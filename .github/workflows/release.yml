name: Release

# One workflow, one tag. Push `v<major>.<minor>.<patch>` and the pipeline
# builds the `kul` CLI for every platform and publishes those archives as a
# GitHub Release with generated release notes. The web app deploys from
# `main` through its own workflow; a tag does not touch it.
#
# The version source of truth is the workspace `Cargo.toml`'s
# `[workspace.package] version`. `apps/web/package.json`'s `version` and the
# tag must match it; `verify` runs `scripts/release-versions.mjs` and fails
# fast on any drift.
#
# workflow_dispatch builds and smoke-tests the CLI on every platform. It
# creates a release only from a tag ref with `dry-run` off.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and smoke-test only (skip the GitHub Release)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version lockstep
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Cargo.toml, apps/web/package.json and the tag agree
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          tag=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=(--tag "$GITHUB_REF_NAME")
          fi
          version=$(node scripts/release-versions.mjs "${tag[@]}")
          echo "version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-cli:
    name: build kul-cli (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            can_run: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            can_run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            # macos-latest is now ARM-based; skip the runtime check for the
            # x86_64 binary (would need Rosetta).
            can_run: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            can_run: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cli-release-${{ matrix.target }}
      - name: Build
        run: cargo build -p kul-cli --release --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.can_run
        shell: bash
        run: |
          set -e
          BIN="$PWD/target/${{ matrix.target }}/release/kul"
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" validate examples/02-three-generations
      - name: Package
        id: package
        shell: bash
        run: |
          set -e
          STAGING="kul-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp README.md LICENSE CHANGELOG.md "$STAGING/" 2>/dev/null || true
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/kul.exe" "$STAGING/"
            7z a -tzip "$STAGING.zip" "$STAGING" >/dev/null
            echo "asset=$STAGING.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/kul" "$STAGING/"
            tar -czf "$STAGING.tar.gz" "$STAGING"
            echo "asset=$STAGING.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kul-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [verify, build-cli]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          pattern: "kul-*"
          merge-multiple: true
      - run: ls -la release-files/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
