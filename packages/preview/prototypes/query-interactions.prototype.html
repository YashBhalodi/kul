<title>Kul query-UX prototype — ticket #277</title>
<!-- ============================================================
  PROTOTYPE — THROWAWAY. Wayfinder map #275.
  Rounds 1–9.2 answered #276 (resolved): single on-tree selection →
  fixed right-edge details widget → flat kin-set list → hover lens.
  ROUND 10 answers #277: the ATTRIBUTE-FILTER UX. Three variants,
  switchable via ?variant=1|2|3, the bottom bar, or ← → keys:
    1 — Widget stack : predicate rows inside the details widget;
                       non-matching people DIMMED
    2 — Filter bar   : a chip sentence in stage chrome above the tree;
                       non-matching people HIDDEN
    3 — Facet rail   : click attribute values (no operators);
                       tree UNTOUCHED + a results list
  The kinship engine below is a mock good only for examples/05.
  The FILTER engine, by contrast, mirrors crates/kul-core/src/query/
  filter.rs faithfully: 9 predicates, three-valued Bool3, interval
  date semantics (partial = whole period, circa = ±5y), AND-only
  conjunction, certain / includeUncertain, missing-sorts-last.
  ============================================================ -->
<style>
  :root {
    --qa: #7c3aed;         /* query anchor A (violet) */
    --qb: #d97706;         /* query anchor B (amber) — also "can't say" */
    --qr: #0d9488;         /* query result (teal) */
    --qpath: #0ea5e9;      /* resolution path glow */
    --sync: #ff2d95;       /* editor selection-sync (real preview token) */
    --ink: #1a1a1a; --muted: #667085; --line: #e4e7ec; --bg: #f8fafc;
    --panel: #ffffff; --chip: #f1f5f9; --chip-on: #ede9fe;
  }
  html, body { margin:0; padding:0; }
  #proto-root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg); min-height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column; }
  #proto-root *, #proto-root *::before, #proto-root *::after { box-sizing: border-box; }

  .proto-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
  .proto-badge { background:#dbeafe; color:#1e40af; border:1px solid #93c5fd;
    font-size:11px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:5px; }
  .proto-title { font-size:14px; font-weight:600; }
  .proto-title span { color:var(--muted); font-weight:400; }
  .proto-head .spacer { flex:1; }
  .sim-wrap { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .sim-wrap select { font-size:12px; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .sim-dot { width:10px; height:10px; border-radius:50%; background:var(--sync); display:inline-block; }

  .explainer { position:absolute; top:12px; left:12px; z-index:30; max-width:365px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 4px 16px rgba(16,24,40,.09); font-size:12.5px; line-height:1.45; }
  .explainer summary { cursor:pointer; padding:8px 12px; font-weight:600; font-size:12.5px; list-style:none; }
  .explainer summary::before { content:"ⓘ "; color:var(--qa); }
  .explainer[open] summary { border-bottom:1px solid var(--line); }
  .explainer .ex-body { padding:8px 12px 10px; }
  .explainer dt { font-weight:600; margin-top:6px; }
  .explainer dd { margin:1px 0 0 0; color:var(--muted); }
  .explainer kbd { background:var(--chip); border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:11px; }

  .stage-row { display:flex; flex:1; min-height:0; position:relative; }
  .stage { position:relative; flex:1; overflow:auto; padding:24px 16px 56px; }
  .stage svg.kul-tree { width:100%; max-width:1250px; height:auto; display:block; margin:0 auto;
    background:#fff; border:1px solid var(--line); border-radius:8px; }

  .kul-card { cursor:pointer; }
  .kul-card.kul-selected > rect { outline:3px solid var(--sync); outline-offset:2px; }
  .kul-card.q-anchor-a > rect { outline:3px solid var(--qa); outline-offset:3px; }
  .kul-card.q-anchor-b > rect { outline:3px solid var(--qb); outline-offset:3px; }
  .kul-card.q-result > rect { outline:3px solid var(--qr); outline-offset:2px;
    filter:drop-shadow(0 0 6px rgba(13,148,136,.55)); }
  .kul-card.q-result-ghost > rect { outline:2px dashed var(--qr); outline-offset:2px; }
  /* the third truth value gets its own paint: amber, dashed — "can't say" */
  .kul-card.q-maybe > rect { outline:3px dashed var(--qb); outline-offset:2px; }
  .kul-card.q-maybe-ghost > rect { outline:2px dotted var(--qb); outline-offset:2px; }
  .kul-card.q-path > rect { outline:2px dashed var(--qpath); outline-offset:4px; }
  .kul-card.q-dim { opacity:.22; }
  .kul-card.q-hide { visibility:hidden; }
  .kul-card.q-pulse > rect { animation:qpulse .9s ease-in-out infinite alternate; }
  @keyframes qpulse { from { outline:3px solid var(--qr); outline-offset:2px; } to { outline:3px solid transparent; outline-offset:8px; } }

  .q-float { position:absolute; z-index:20; }
  .halo-toast { position:absolute; z-index:26; background:#0f172a; color:#f8fafc;
    padding:7px 11px; border-radius:8px; font-size:12px; max-width:300px;
    box-shadow:0 6px 20px rgba(2,6,23,.35); }
  .sync-hint { position:absolute; z-index:19; right:12px; bottom:12px; background:#fff7ed;
    border:1px solid #fed7aa; color:#9a3412; font-size:11.5px; padding:5px 10px; border-radius:8px; }
  .sync-hint kbd { background:#fff; border:1px solid #fed7aa; border-radius:4px; padding:0 4px; }

  /* the bookmarked docked-tag whisper (#276) */
  .whisper-pill { position:absolute; z-index:24; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px; box-shadow:0 6px 20px rgba(16,24,40,.16);
    display:flex; align-items:center; gap:7px; font-size:14px; font-weight:700; white-space:nowrap; }
  .whisper-pill.transient { opacity:.96; }
  .whisper-pill .tie-note { font-weight:400; font-size:12px; color:var(--muted); }
  .whisper-pill .sep { color:var(--muted); font-weight:400; }
  .whisper-pill .term { cursor:help; }
  .whisper-pill .term.gu { font-size:15.5px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; flex:none; cursor:default; }
  .dot.a { background:var(--qa); box-shadow:0 0 0 2px #ede9fe; }
  .swap-mini { cursor:pointer; color:var(--muted); font-size:14px; user-select:none; border-radius:5px; padding:0 3px; }
  .swap-mini:hover { color:var(--qa); background:var(--chip-on); }

  /* the "can't say" whisper — same docked-tag grammar, amber */
  .reason-pill { position:absolute; z-index:23; background:#fffbeb; border:1px solid #fcd34d;
    color:#92400e; border-radius:999px; padding:4px 11px; font-size:11.5px; white-space:nowrap;
    box-shadow:0 6px 18px rgba(146,64,14,.16); }
  .reason-pill b { font-weight:700; }
  /* the ? mark riding a "can't say" card */
  .maybe-mark { position:absolute; z-index:22; width:17px; height:17px; border-radius:50%;
    background:var(--qb); color:#fff; font-size:11px; font-weight:700; line-height:17px;
    text-align:center; box-shadow:0 1px 4px rgba(146,64,14,.4); pointer-events:none; }

  /* the plate — a fixed widget docked to the stage's right edge (#276 round 9.1) */
  .pop { position:absolute; top:12px; right:12px; width:272px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px;
    box-shadow:0 6px 24px rgba(16,24,40,.14); font-size:12px; z-index:32;
    max-height:calc(100% - 24px); overflow-y:auto; }
  .pop-head { display:flex; align-items:center; gap:6px; padding:8px 10px;
    border-bottom:1px solid var(--line); }
  .pop-crumb { flex:1; font-weight:600; font-size:12px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pop-close { cursor:pointer; color:var(--muted); padding:0 3px; user-select:none; }
  .pop-body { padding:9px 11px; }
  .detail-name { font-weight:700; font-size:13.5px; }
  .detail-line { color:var(--muted); margin-top:3px; line-height:1.45; }
  .detail-line b { color:var(--ink); font-weight:600; }
  .unrec { font-style:italic; color:#b45309; }
  .ghost-note { margin-top:5px; font-size:11px; color:#92400e; background:#fef3c7;
    border:1px solid #fcd34d; border-radius:5px; padding:2px 6px; display:inline-block; }
  .plate-section { border-top:1px solid var(--line); }
  .plate-sec-head { display:flex; align-items:center; padding:8px 11px; font-weight:600;
    cursor:pointer; user-select:none; font-size:12px; }
  .plate-sec-head:hover { background:var(--chip); }
  .plate-sec-head .arr { margin-left:auto; color:var(--muted); font-weight:400; }
  .plate-sec-head .pip { margin-left:auto; margin-right:6px; background:var(--qr); color:#fff;
    font-size:10px; font-weight:700; border-radius:999px; padding:1px 6px; }
  .kin-list { max-height:206px; overflow-y:auto; padding:3px 6px 7px; }
  .kin-row { display:flex; align-items:center; padding:6px 8px; border-radius:7px;
    cursor:pointer; user-select:none; font-size:12px; }
  .kin-row:hover { background:var(--chip); }
  .kin-row.on { background:var(--chip-on); color:#5b21b6; font-weight:600; }
  .kin-row .cnt { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  .kin-row .cnt.zero { color:#b42318; }
  .lens-hint { padding:7px 11px; border-top:1px solid var(--line); color:var(--muted);
    font-size:11px; line-height:1.5; }
  .lens-hint b { color:#5b21b6; }

  /* ---------- shared filter atoms ---------- */
  .f-scope { display:flex; gap:5px; padding:8px 11px 4px; flex-wrap:wrap; }
  .f-scope .sc { font-size:11px; border:1px solid var(--line); background:#fff; color:var(--muted);
    border-radius:999px; padding:3px 9px; cursor:pointer; user-select:none; }
  .f-scope .sc.on { background:var(--chip-on); border-color:#c4b5fd; color:#5b21b6; font-weight:600; }
  .f-scope .sc.off { opacity:.45; cursor:not-allowed; }
  .f-rows { padding:2px 11px 6px; }
  .f-row { display:flex; align-items:center; gap:4px; margin-top:5px; }
  .f-row .and { font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;
    width:32px; flex:none; }
  .f-row select, .f-row input { font-size:11.5px; padding:3px 4px; border:1px solid var(--line);
    border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
  .f-row select.fld { flex:1.05; }
  .f-row select.op { flex:.85; }
  .f-row input.val, .f-row select.val { flex:1; width:100%; }
  .f-row.f-row2 { margin-top:3px; }
  .f-row .rm { cursor:pointer; color:var(--muted); font-size:13px; padding:0 2px; user-select:none; flex:none; }
  .f-row .rm:hover { color:#b42318; }
  .f-add { margin:7px 0 2px 32px; font-size:11.5px; color:var(--qa); cursor:pointer; user-select:none;
    font-weight:600; }
  .f-add:hover { text-decoration:underline; }
  .f-note { padding:0 11px 8px 43px; font-size:10.5px; color:var(--muted); line-height:1.45; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { font:inherit; font-size:11px; padding:3px 8px; border:0; background:#fff;
    color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--qb); color:#fff; font-weight:600; }
  .seg button:first-child.on { background:var(--qr); }
  .f-mode { padding:6px 11px 2px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .f-mode .lbl { font-size:11px; color:var(--muted); }
  .f-modenote { padding:3px 11px 8px; font-size:10.5px; line-height:1.45; color:var(--muted); }
  .f-tally { border-top:1px solid var(--line); padding:8px 11px; font-size:11.5px; }
  .f-tally b { font-variant-numeric:tabular-nums; }
  .f-tally .excl { display:block; margin-top:4px; color:#92400e; background:#fffbeb;
    border:1px solid #fcd34d; border-radius:6px; padding:4px 7px; font-size:11px; line-height:1.45; }
  .f-tally .excl u { cursor:pointer; }
  .f-sortline { padding:6px 11px 9px; display:flex; align-items:center; gap:5px; font-size:11px;
    color:var(--muted); flex-wrap:wrap; }
  .f-sortline select { font-size:11px; padding:2px 4px; border:1px solid var(--line);
    border-radius:6px; background:#fff; }
  .f-dead { padding:0 11px 9px; font-size:10.5px; color:#b45309; line-height:1.45; }

  /* ---------- variant 2 — the filter bar ---------- */
  .filterbar { display:none; align-items:center; gap:7px; flex-wrap:wrap; padding:8px 16px;
    background:#fffdf7; border-bottom:1px solid var(--line); font-size:12px; position:relative; z-index:34; }
  #proto-root.v2 .filterbar { display:flex; }
  .filterbar .kw { color:var(--muted); }
  .fchip { display:inline-flex; align-items:center; gap:5px; background:#fff; border:1px solid #cbd5e1;
    border-radius:999px; padding:3px 10px; cursor:pointer; user-select:none; font-size:12px;
    white-space:nowrap; }
  .fchip:hover { border-color:var(--qa); }
  .fchip.scope { background:var(--chip-on); border-color:#c4b5fd; color:#5b21b6; font-weight:600; }
  .fchip.pred { border-color:#5eead4; background:#f0fdfa; }
  .fchip.pred.unknownish { border-color:#fcd34d; background:#fffbeb; }
  .fchip.mode { border-color:#fcd34d; background:#fffbeb; color:#92400e; font-weight:600; }
  .fchip .x { color:var(--muted); font-size:12px; }
  .fchip .x:hover { color:#b42318; }
  .fchip.add { border-style:dashed; color:var(--qa); font-weight:700; }
  .fbar-tally { margin-left:auto; display:flex; align-items:center; gap:9px; font-size:11.5px; }
  .fbar-tally .num { font-weight:700; font-variant-numeric:tabular-nums; }
  .fbar-tally .hidden-note { color:#92400e; background:#fffbeb; border:1px solid #fcd34d;
    border-radius:999px; padding:2px 9px; }
  .fbar-tally .hidden-note u { cursor:pointer; }
  .fpop { position:absolute; z-index:40; top:100%; margin-top:4px; background:var(--panel);
    border:1px solid var(--line); border-radius:9px; box-shadow:0 8px 26px rgba(16,24,40,.18);
    padding:8px; min-width:232px; }
  .fpop .r { display:flex; gap:5px; align-items:center; }
  .fpop select, .fpop input { font-size:11.5px; padding:3px 5px; border:1px solid var(--line);
    border-radius:6px; background:#fff; }
  .fpop .fld-menu { display:grid; grid-template-columns:1fr 1fr; gap:3px; }
  .fpop .fld-menu button { font:inherit; font-size:11.5px; text-align:left; padding:4px 7px;
    border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  .fpop .fld-menu button:hover { background:var(--chip); border-color:var(--qa); }
  .fpop .hint { font-size:10.5px; color:var(--muted); margin-top:6px; line-height:1.4; }

  /* ---------- variant 3 — the facet rail ---------- */
  .rail { display:none; width:280px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; font-size:12px; }
  #proto-root.v3 .rail { display:block; }
  .rail-head { padding:9px 12px; border-bottom:1px solid var(--line); font-weight:700; font-size:12.5px;
    display:flex; align-items:center; }
  .rail-head .n { margin-left:auto; font-weight:600; color:var(--qr); font-variant-numeric:tabular-nums; }
  .facet { border-bottom:1px solid var(--line); padding:7px 12px 9px; }
  .facet h4 { margin:0 0 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); font-weight:700; display:flex; align-items:center; }
  .facet h4 .single { text-transform:none; letter-spacing:0; margin-left:auto; font-weight:400;
    font-size:10px; color:#b45309; cursor:help; }
  .fv { display:flex; align-items:center; gap:7px; padding:3px 5px; border-radius:6px; cursor:pointer;
    user-select:none; }
  .fv:hover { background:var(--chip); }
  .fv.on { background:var(--chip-on); color:#5b21b6; font-weight:600; }
  .fv .box { width:12px; height:12px; border:1.5px solid #94a3b8; border-radius:3px; flex:none; }
  .fv .box.radio { border-radius:50%; }
  .fv.on .box { background:var(--qa); border-color:var(--qa); }
  .fv .lab { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fv .lab.abs { font-style:italic; color:#b45309; }
  .fv .n { color:var(--muted); font-variant-numeric:tabular-nums; font-size:11px; }
  .fv .n .q { color:var(--qb); font-weight:700; }
  .fv.dead { opacity:.4; }
  .where-line { padding:8px 12px; background:#f0fdfa; border-bottom:1px solid var(--line);
    font-size:11px; line-height:1.5; color:#0f766e; }
  .where-line b { color:#134e4a; }
  .where-line .none { color:var(--muted); font-style:italic; }
  .rail-res { padding:7px 12px 14px; }
  .rail-res h4 { margin:0 0 5px; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); font-weight:700; }
  .rrow { display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:6px; cursor:pointer; }
  .rrow:hover { background:var(--chip); }
  .rrow .rn { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rrow .meta { font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rrow.maybe { background:#fffbeb; }
  .rrow.maybe .rn { color:#92400e; }
  .rrow .qm { background:var(--qb); color:#fff; font-size:9.5px; font-weight:700; border-radius:999px;
    padding:0 5px; flex:none; }
  .rrow .why { display:block; font-size:10px; color:#b45309; }
  .rail-empty { color:var(--muted); font-style:italic; padding:4px 6px; line-height:1.5; }
  .excl-fold { margin-top:8px; background:#fffbeb; border:1px solid #fcd34d; border-radius:7px;
    padding:6px 8px; font-size:10.5px; color:#92400e; line-height:1.5; }
  .excl-fold u { cursor:pointer; }

  /* ---------- the variant switcher (throwaway chrome) ---------- */
  .varbar { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:60;
    display:flex; align-items:center; gap:2px; background:#0f172a; color:#f8fafc;
    border-radius:999px; padding:4px 6px; box-shadow:0 8px 26px rgba(2,6,23,.4); font-size:12px; }
  .varbar button { font:inherit; background:transparent; border:0; color:#f8fafc; cursor:pointer;
    padding:3px 8px; border-radius:999px; font-size:14px; line-height:1; }
  .varbar button:hover { background:rgba(248,250,252,.16); }
  .varbar .vlabel { padding:2px 8px; white-space:nowrap; }
  .varbar .vlabel b { color:#a5b4fc; }
</style>

<div id="proto-root" class="v1">
  <div class="proto-head">
    <span class="proto-badge" id="protoBadge">PROTOTYPE · ROUND 10 · FILTER UX</span>
    <span class="proto-title">Attribute filtering on the canonical tree <span>— #277 · three variants</span></span>
    <span class="spacer"></span>
    <span class="sim-wrap">
      Phrasing language:
      <select id="langSel">
        <option value="en">English</option>
        <option value="gu">ગુજરાતી</option>
      </select>
    </span>
    <span class="sim-wrap">
      <span class="sim-dot"></span> Simulate editor cursor on:
      <select id="editorSim"><option value="">— none —</option></select>
    </span>
  </div>

  <div class="filterbar" id="filterbar"></div>

  <div class="stage-row">
    <div class="rail" id="rail"></div>
    <div class="stage" id="stage">
      <details class="explainer" id="explainer" open>
        <summary id="exSummary">How this variant filters</summary>
        <div class="ex-body" id="exBody"></div>
      </details>

<script>
(function () {
  "use strict";

  /* =============== mock family data (examples/05) =============== */
  var P = {
    giuseppe: { name: "Giuseppe Rossi", g: "m", born: 1940 },
    sofia:    { name: "Sofia Rossi",    g: "f", born: 1943 },
    marco:    { name: "Marco Rossi",    g: "m", born: 1968 },
    lucia:    { name: "Lucia Rossi",    g: "f", born: 1971 },
    elena:    { name: "Elena Bianchi",  g: "f", born: 1970 },
    paolo:    { name: "Paolo Conti",    g: "m", born: 1969 },
    matteo:   { name: "Matteo Rossi",   g: "m", born: 1997 },

    aldo:     { name: "Aldo Bianchi",   g: "m", born: 1942 },
    bianca:   { name: "Bianca Bianchi", g: "f", born: 1945 }
  };

  /* The *records* the filter sees — deliberately gappy, because the third
     truth value is the whole point of this round. Gaps planted:
       aldo   — `family` NOT recorded  → any family predicate is Unknown
       aldo   — born `~1942` (circa ±5y) → `born < 1945` is Unknown
       sofia  — born `1943` (year only) → whole-year interval
       bianca — `born` NOT recorded    → every born predicate is Unknown
       died   — recorded for 2 of 10   → and "not recorded" ≠ living. */
  var REC = {
    giuseppe: { family: "Rossi",   given: "Giuseppe", gender: "male",   born: "1940-05-19", died: "2018-03-02" },
    sofia:    { family: "Rossi",   given: "Sofia",    gender: "female", born: "1943" },
    marco:    { family: "Rossi",   given: "Marco",    gender: "male",   born: "1968-09-30" },
    lucia:    { family: "Rossi",   given: "Lucia",    gender: "female", born: "1971-04-08" },
    elena:    { family: "Bianchi", given: "Elena",    gender: "female", born: "1970-11-15" },
    paolo:    { family: "Conti",   given: "Paolo",    gender: "male",   born: "1969-03-17" },
    matteo:   { family: "Rossi",   given: "Matteo",   gender: "male",   born: "1997-02-14" },
    giulia:   { family: "Conti",   given: "Giulia",   gender: "female", born: "1998-06-26" },
    aldo:     {                    given: "Aldo",     gender: "male",   born: "~1942",      died: "2005" },
    bianca:   { family: "Bianchi", given: "Bianca",   gender: "female" }
  };

  var PARENTS = {
    marco: ["giuseppe", "sofia"], lucia: ["giuseppe", "sofia"],
    matteo: ["marco", "elena"], giulia: ["lucia", "paolo"],
    elena: ["aldo", "bianca"]
  };
  var SPOUSES = {
    giuseppe: ["sofia"], sofia: ["giuseppe"], marco: ["elena"], elena: ["marco"],
    lucia: ["paolo"], paolo: ["lucia"], matteo: ["giulia"], giulia: ["matteo"],
    aldo: ["bianca"], bianca: ["aldo"]
  };
  var GHOSTS = { elena: true, giulia: true };
  var ALL = Object.keys(P);

  function parentsOf(x) { return PARENTS[x] || []; }
  function spousesOf(x) { return SPOUSES[x] || []; }
  function childrenOf(x) {
    return ALL.filter(function (k) { return parentsOf(k).indexOf(x) >= 0; });
  }
  function siblingsOf(x) {
    var ps = parentsOf(x);
    if (!ps.length) return [];
    return childrenOf(ps[0]).filter(function (y) { return y !== x; });
  }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }

  /* =============== mock kinship engine (unchanged since round 1) =============== */
  function ancEntries(x) {
    var out = [];
    (function walk(chain) {
      var last = chain[chain.length - 1];
      out.push({ anc: last, up: chain.length - 1, chain: chain.slice() });
      parentsOf(last).forEach(function (p) { walk(chain.concat([p])); });
    })([x]);
    return out;
  }
  function ancestorsOf(x) {
    return uniq(ancEntries(x).filter(function (e) { return e.up > 0; }).map(function (e) { return e.anc; }));
  }
  function descendantsOf(x) {
    var out = [];
    (function walk(y) {
      childrenOf(y).forEach(function (c) { if (out.indexOf(c) < 0) { out.push(c); walk(c); } });
    })(x);
    return out;
  }

  function t(en, gu, script, note) { return { en: en, gu: gu, script: script, note: note || "" }; }

  function auntUncleTerm(side, g, alterId, linkParentId) {
    if (side === "paternal" && g === "m") {
      var elder = P[alterId].born < P[linkParentId].born;
      return elder ? t("paternal uncle (father’s elder brother)", "moṭā bāpā", "મોટા બાપા")
                   : t("paternal uncle (father’s brother)", "kākā", "કાકા");
    }
    if (side === "paternal") return t("paternal aunt (father’s sister)", "foī", "ફોઈ");
    if (g === "m") return t("maternal uncle (mother’s brother)", "māmā", "મામા");
    return t("maternal aunt (mother’s sister)", "māsī", "માસી");
  }

  function bloodTerm(up, down, egoChain, alterChain) {
    var alter = alterChain[0], ag = P[alter].g;
    var side = up >= 2 ? (P[egoChain[1]].g === "m" ? "paternal" : "maternal") : null;
    if (up === 1 && down === 0) return ag === "m" ? t("father", "bāpuji", "બાપુજી") : t("mother", "bā", "બા");
    if (up === 2 && down === 0) {
      if (side === "paternal") return ag === "m" ? t("grandfather (paternal)", "dādā", "દાદા") : t("grandmother (paternal)", "dādī", "દાદી");
      return ag === "m" ? t("grandfather (maternal)", "nānā", "નાના") : t("grandmother (maternal)", "nānī", "નાની");
    }
    if (up === 0 && down === 1) return ag === "m" ? t("son", "dīkro", "દીકરો") : t("daughter", "dīkrī", "દીકરી");
    if (up === 0 && down === 2) {
      var viaSon = P[alterChain[1]].g === "m";
      if (viaSon) return ag === "m" ? t("grandson (son’s son)", "pautra", "પૌત્ર") : t("granddaughter (son’s daughter)", "pautrī", "પૌત્રી");
      return ag === "m" ? t("grandson (daughter’s son)", "dohitra", "દોહિત્ર") : t("granddaughter (daughter’s daughter)", "dohitrī", "દોહિત્રી");
    }
    if (up === 1 && down === 1) {
      var elder = P[alter].born < P[egoChain[0]].born;
      if (ag === "m") return elder ? t("elder brother", "moṭā bhāī", "મોટા ભાઈ") : t("younger brother", "nānā bhāī", "નાના ભાઈ");
      return elder ? t("elder sister", "moṭī ben", "મોટી બેન") : t("younger sister", "nānī ben", "નાની બેન");
    }
    if (up === 2 && down === 1) return auntUncleTerm(side, ag, alter, egoChain[1]);
    if (up === 1 && down === 2) {
      var viaBro = P[alterChain[1]].g === "m";
      if (viaBro) return ag === "m" ? t("nephew (brother’s son)", "bhatrījo", "ભત્રીજો") : t("niece (brother’s daughter)", "bhatrījī", "ભત્રીજી");
      return ag === "m" ? t("nephew (sister’s son)", "bhāṇej", "ભાણેજ") : t("niece (sister’s daughter)", "bhāṇī", "ભાણી");
    }
    if (up === 2 && down === 2) {
      var au = alterChain[1];
      var auT = auntUncleTerm(side, P[au].g, au, egoChain[1]);
      var suffix = ag === "m" ? ["-no dīkro", "નો દીકરો"] : ["-ni dīkrī", "ની દીકરી"];
      return t("first cousin (" + auT.en + "’s child)", auT.gu + suffix[0], auT.script + suffix[1],
        "genitive walk of the path backbone — no single lexeme");
    }
    var enG = ag === "m" ? "kinsman" : "kinswoman";
    return t("distant blood " + enG + " (up " + up + ", down " + down + ")", "dūr-nā sagā", "દૂરનાં સગાં",
      "beyond the lexicalized inventory — compositional fallback");
  }

  function bloodTies(ego, alter) {
    if (ego === alter) return [];
    var A = ancEntries(ego), B = ancEntries(alter), cands = [];
    A.forEach(function (a) {
      B.forEach(function (b) {
        if (a.anc === b.anc) cands.push({ up: a.up, down: b.up, egoChain: a.chain, alterChain: b.chain, total: a.up + b.up });
      });
    });
    if (!cands.length) return [];
    var min = Math.min.apply(null, cands.map(function (c) { return c.total; }));
    var seen = {}, ties = [];
    cands.filter(function (c) { return c.total === min; }).forEach(function (c) {
      var k = c.up + "/" + c.down;
      if (seen[k]) return;
      seen[k] = 1;
      var term = bloodTerm(c.up, c.down, c.egoChain, c.alterChain);
      var path = c.egoChain.concat(c.alterChain.slice(0, -1).reverse());
      ties.push({ en: term.en, gu: term.gu, script: term.script, note: term.note, kind: "blood", path: path });
    });
    return ties;
  }

  function affinalTies(ego, alter) {
    var ties = [];
    function push(term, path) {
      ties.push({ en: term.en, gu: term.gu, script: term.script, note: term.note, kind: "in-law", path: path });
    }
    if (spousesOf(ego).indexOf(alter) >= 0) {
      push(P[alter].g === "m" ? t("husband", "pati / var", "પતિ / વર") : t("wife", "patnī", "પત્ની"), [ego, alter]);
    }
    ALL.forEach(function (K) {
      if (K === ego || K === alter) return;
      if (spousesOf(K).indexOf(alter) < 0) return;
      bloodTies(ego, K).forEach(function (bt) {
        var shape = bt.path.length;
        var up1down1 = /brother|sister/.test(bt.en) && shape === 3;
        var term = null, ag = P[alter].g;
        if (/uncle|aunt/.test(bt.en)) {
          if (bt.gu === "foī") term = t("uncle (foī’s husband)", "fuvā", "ફુવા");
          else if (bt.gu === "māmā") term = t("aunt (māmā’s wife)", "māmī", "મામી");
          else if (bt.gu === "māsī") term = t("uncle (māsī’s husband)", "māsā", "માસા");
          else term = t("aunt (kākā’s wife)", "kākī", "કાકી");
        } else if (up1down1) {
          term = P[K].g === "m" ? t("sister-in-law (brother’s wife)", "bhābhī", "ભાભી")
                                : t("brother-in-law (sister’s husband)", "banevī", "બનેવી");
        } else if (/^son$|^daughter$/.test(bt.en)) {
          term = ag === "m" ? t("son-in-law (daughter’s husband)", "jamāī", "જમાઈ")
                            : t("daughter-in-law (son’s wife)", "vahu / putravadhū", "વહુ / પુત્રવધૂ");
        } else {
          term = t(bt.en + "’s " + (ag === "m" ? "husband" : "wife"),
                   bt.gu + (ag === "m" ? "-no var" : "-nī patnī"), bt.script + (ag === "m" ? "નો વર" : "ની પત્ની"),
                   "compositional — no single lexeme");
        }
        push(term, bt.path.concat([alter]));
      });
    });
    spousesOf(ego).forEach(function (S) {
      if (S === alter) return;
      bloodTies(S, alter).forEach(function (bt) {
        var term = null, ag = P[alter].g;
        if (bt.en === "father") term = t("father-in-law (spouse’s father)", "sasro", "સસરો");
        else if (bt.en === "mother") term = t("mother-in-law (spouse’s mother)", "sāsu", "સાસુ");
        else if (/brother|sister/.test(bt.en) && bt.path.length === 3) {
          if (P[S].g === "f") term = ag === "m" ? t("brother-in-law (wife’s brother)", "sāḷo", "સાળો")
                                                : t("sister-in-law (wife’s sister)", "sāḷī", "સાળી");
          else if (ag === "m") {
            var elder = P[alter].born < P[S].born;
            term = elder ? t("brother-in-law (husband’s elder brother)", "jeṭh", "જેઠ")
                         : t("brother-in-law (husband’s younger brother)", "diyar", "દિયર");
          } else term = t("sister-in-law (husband’s sister)", "naṇand", "નણંદ");
        } else {
          term = t("spouse’s " + bt.en, "(spouse-nā) " + bt.gu, bt.script, "compositional — no single lexeme");
        }
        push(term, [ego].concat(bt.path));
      });
    });
    childrenOf(ego).forEach(function (c) {
      spousesOf(c).forEach(function (sp) {

                                  : t("co-mother-in-law (child’s spouse’s mother)", "vevāṇ", "વેવાણ"),

  }

  function resolvePair(ego, alter) {

    }
    var seen = {}, out = [];
    blood.concat(affinal).forEach(function (tie) { if (!seen[tie.gu]) { seen[tie.gu] = 1; out.push(tie); } });

  }

  function auntsUnclesOf(x) {
    var out = [];
    parentsOf(x).forEach(function (p) {

        out.push(s);
        spousesOf(s).forEach(function (sp) { out.push(sp); });

  }

    var out = [];

    });
    return uniq(out).filter(function (y) { return y !== x; });
  }
  function niecesNephewsOf(x) {
    var out = [];
    siblingsOf(x).forEach(function (s) { out = out.concat(childrenOf(s)); });

  function inLawsOf(x) {
    var out = [];
    spousesOf(x).forEach(function (S) { out = out.concat(parentsOf(S)).concat(siblingsOf(S)); });
    siblingsOf(x).forEach(function (s) { out = out.concat(spousesOf(s)); });
    childrenOf(x).forEach(function (c) { out = out.concat(spousesOf(c)); });
    return uniq(out).filter(function (y) { return y !== x; });

  var KIN_SETS = [
    { id: "parents", label: "Parents", fn: parentsOf },
    { id: "children", label: "Children", fn: childrenOf },
    { id: "siblings", label: "Siblings", fn: siblingsOf },
    { id: "spouses", label: "Spouses", fn: spousesOf },
    { id: "ancestors", label: "Ancestors", fn: ancestorsOf },
    { id: "descendants", label: "Descendants", fn: descendantsOf },
    { id: "auntsUncles", label: "Aunts & uncles", fn: auntsUnclesOf },
    { id: "niecesNephews", label: "Nieces & nephews", fn: niecesNephewsOf },
    { id: "cousins", label: "Cousins", fn: cousinsOf },
    { id: "inLaws", label: "In-laws", fn: inLawsOf },
    { id: "stepParents", label: "Step-parents", fn: function () { return []; } },
    { id: "stepSiblings", label: "Step-siblings", fn: function () { return []; } },
    { id: "stepChildren", label: "Step-children", fn: function () { return []; } }

  function setById(id) { return KIN_SETS.filter(function (s) { return s.id === id; })[0]; }

  /* ==========================================================
     FILTER ENGINE — a faithful port of kul-core query/filter.rs.
     Three-valued (T / F / U), interval dates, AND-only.
     ========================================================== */
  var FIELDS = [
    { f: "name",   label: "name",   date: false },
    { f: "family", label: "family", date: false },
    { f: "given",  label: "given",  date: false },
    { f: "gender", label: "gender", date: false },
    { f: "born",   label: "born",   date: true },
    { f: "died",   label: "died",   date: true },
    { f: "id",     label: "id",     date: false }

  function fieldDef(f) { return FIELDS.filter(function (d) { return d.f === f; })[0]; }
  var OPS = {
    eq: "=", neq: "≠", lt: "<", lte: "≤", gt: ">", gte: "≥",
    "in": "∈", present: "is recorded", absent: "not recorded"

  function opsFor(f) {

      : ["eq", "neq", "in", "present", "absent"];

  function needsValue(op) { return op !== "present" && op !== "absent"; }

  function recOf(id) {
    var r = REC[id] || {};

  }
  function ymd(y, m, d) { return y * 10000 + m * 100 + d; }
  function daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  /* Kul date literal → closed interval. Partial = the whole period;
     circa (`~`) = ±5 years on both bounds. Exactly DateLit's bounds. */
  function parseKulDate(lit) {
    if (!lit) return null;
    var circa = lit.charAt(0) === "~";
    var s = circa ? lit.slice(1) : lit;
    var m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(s);
    if (!m) return null;
    var y = +m[1], mo = m[2] ? +m[2] : null, d = m[3] ? +m[3] : null, lo, hi;
    if (d) { lo = hi = ymd(y, mo, d); }
    else if (mo) { lo = ymd(y, mo, 1); hi = ymd(y, mo, daysIn(y, mo)); }
    else { lo = ymd(y, 1, 1); hi = ymd(y, 12, 31); }
    if (circa) { lo -= 50000; hi += 50000; }
    return { lo: lo, hi: hi, text: lit, fuzzy: circa || !d };
  }
  var T = "T", F3 = "F", U = "U";
  function not3(v) { return v === T ? F3 : (v === F3 ? T : U); }
  function dateContains(rec, lit) {
    if (lit.lo <= rec.lo && rec.hi <= lit.hi) return T;
    if (rec.hi < lit.lo || lit.hi < rec.lo) return F3;
    return U;
  }
  function dateOrder(rec, lit, op) {
    var all, none;
    if (op === "lt") { all = rec.hi < lit.lo; none = rec.lo >= lit.hi; }
    else if (op === "lte") { all = rec.hi <= lit.lo; none = rec.lo > lit.hi; }
    else if (op === "gt") { all = rec.lo > lit.hi; none = rec.hi <= lit.lo; }
    else { all = rec.lo >= lit.hi; none = rec.hi < lit.lo; }
    return all ? T : (none ? F3 : U);
  }
  function evalPred(rec, p) {
    var isDate = fieldDef(p.field).date;
    var raw = rec[p.field];
    if (p.op === "present") return raw === undefined ? F3 : T;
    if (p.op === "absent") return raw === undefined ? T : F3;
    if (isDate) {
      var lit = parseKulDate(p.value);
      if (!lit) return U;                       // malformed literal → engine errors; here: unknown
      if (raw === undefined) return U;
      var rd = parseKulDate(raw);
      if (p.op === "eq") return dateContains(rd, lit);
      if (p.op === "neq") return not3(dateContains(rd, lit));
      return dateOrder(rd, lit, p.op);
    }
    if (p.op === "in") {
      if (raw === undefined) return U;
      return (p.values || []).indexOf(raw) >= 0 ? T : F3;
    }
    var base = raw === undefined ? U : (raw === p.value ? T : F3);
    return p.op === "neq" ? not3(base) : base;
  }
  /* Three-valued AND + certainty mode. Returns the verdict and, when
     Unknown, WHICH predicates could not be decided — the "why" every
     variant needs to distinguish a maybe-row from a true row. */
  function judge(id, preds) {
    var rec = recOf(id), unknown = [], anyFalse = false;
    preds.forEach(function (p) {

    var f = p.field;
    if (p.op === "present") return f + " is recorded";
    if (p.op === "absent") return f + " not recorded";
    if (p.op === "in") return f + " ∈ {" + (p.values || []).join(", ") + "}";
    return f + " " + OPS[p.op] + " " + (p.value || "…");
  }
  function whyUnknown(id, preds) {
    var rec = recOf(id);

      var raw = rec[p.field];
      if (fieldDef(p.field).date) {
        var d = parseKulDate(raw);
        if (d && d.text.charAt(0) === "~") return raw + " is approximate (±5y) — straddles " + predLabel(p);

  function sortIds(ids, spec) {

      if (fieldDef(spec.field).date) { var d = parseKulDate(raw); return d ? d.lo * 100000 + (d.hi % 100000) : null; }

      if (ka === null) return 1;               // missing sorts last, always
      if (kb === null) return -1;

  /* ---------------- filter state (shared across variants) ---------------- */
  var F = {

    mode: "certain",           // "certain" | "includeUncertain"
    sort: null,                // { field, dir } — only variant 3 can express it

  /* =============== DOM + paint helpers =============== */
  var root = document.getElementById("proto-root");
  var stage = document.getElementById("stage");
  var stageRow = document.querySelector(".stage-row");
  var bar = document.getElementById("filterbar");
  var rail = document.getElementById("rail");
  var svg = stage.querySelector("svg");
  svg.classList.add("kul-tree");
  var PAINT = ["q-anchor-a", "q-anchor-b", "q-result", "q-result-ghost", "q-maybe",
               "q-maybe-ghost", "q-path", "q-dim", "q-hide", "q-pulse"];

  function cardsFor(id, kind) {
    var sel = '.kul-card[data-person-id="' + id + '"]';
    if (kind) sel += '[data-kind="' + kind + '"]';
    return Array.prototype.slice.call(svg.querySelectorAll(sel));
  }
  function allCards() {
    return Array.prototype.slice.call(svg.querySelectorAll(".kul-card[data-person-id]"));
  }
  function clearPaint() {
    allCards().forEach(function (c) { PAINT.forEach(function (k) { c.classList.remove(k); }); });
    removeMarks();
  }
  function addClass(id, cls, kind) { cardsFor(id, kind).forEach(function (c) { c.classList.add(cls); }); }
  function dimAllExcept(keep) {
    allCards().forEach(function (c) {
      if (keep.indexOf(c.getAttribute("data-person-id")) < 0) c.classList.add("q-dim");
    });
  }
  function paintResults(anchorIds, resultIds) {
    clearPaint();
    anchorIds.forEach(function (a, i) { addClass(a, i === 0 ? "q-anchor-a" : "q-anchor-b", "canonical"); });
    resultIds.forEach(function (r) {
      addClass(r, "q-result", "canonical");

    });
    dimAllExcept(anchorIds.concat(resultIds));

  }
  function pathMids(a, b, ties) {
    var mid = [];

    });

  }
  function cardRect(id) {

    var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { left: r.left - s.left + stage.scrollLeft, top: r.top - s.top + stage.scrollTop, width: r.width, height: r.height };
  }
  function firstName(id) { return P[id].name.split(" ")[0]; }

  var LANG = "en";
  function termShort(tie) { return LANG === "gu" ? tie.script : tie.en.replace(/\s*\(.*?\)/, ""); }
  function termFull(tie) { return LANG === "gu" ? tie.gu + " — " + tie.en : tie.en; }
  function termSpan(tie) {

  function detailHtml(id) {
    var pd = P[id];

    lines.push(fieldLine("family", id, "family") + fieldLine("gender", id, "gender") +
               fieldLine("born", id, "born") + fieldLine("died", id, "died"));
    var ps = parentsOf(id);
    if (ps.length) lines.push('<div class="detail-line">child of <b>' + P[ps[0]].name + "</b> &amp; <b>" + P[ps[1]].name + "</b></div>");
    var sp = spousesOf(id);
    if (sp.length) lines.push('<div class="detail-line">married to <b>' + sp.map(function (s) { return P[s].name; }).join(", ") + "</b></div>");
    var kids = childrenOf(id);
    if (kids.length) lines.push('<div class="detail-line">' + kids.length + " child" + (kids.length > 1 ? "ren" : "") + ": <b>" +
      kids.map(function (k) { return P[k].name; }).join(", ") + "</b></div>");
    if (GHOSTS[id]) lines.push('<div class="ghost-note">↺ also appears as a past-record ghost</div>');

  /* =============== floating helpers =============== */
  function removeFloats() {
    Array.prototype.slice.call(stage.querySelectorAll(".q-float")).forEach(function (n) { n.remove(); });
    var hint = stageRow.querySelector(".sync-hint");
    if (hint) hint.remove();
  }
  function removeMarks() {
    Array.prototype.slice.call(stage.querySelectorAll(".maybe-mark")).forEach(function (n) { n.remove(); });
  }
  function place(el, left, top) {

    el.style.top = Math.max(8, top) + "px";

  function toastAt(msg, rect) {
    var old = stage.querySelector(".halo-toast");
    if (old) old.remove();
    var toast = document.createElement("div");
    toast.className = "halo-toast q-float";
    toast.textContent = msg;
    stage.appendChild(toast);
    place(toast, rect.left + rect.width / 2 - toast.offsetWidth / 2, rect.top - toast.offsetHeight - 12);
  }
  function removeWhisper() {

    if (old) old.remove();
    var r = stage.querySelector(".reason-pill");
    if (r) r.remove();
  }
  /* the bookmarked docked-tag whisper (#276) */
  function whisperAt(a, b, ties, onSwap, transient) {
    removeWhisper();
    var pill = document.createElement("div");
    pill.className = "whisper-pill q-float" + (transient ? " transient" : "");
    var dotA = '<span class="dot a" title="from ' + P[a].name + "’s perspective\"></span>";
    if (!ties.length) {
      pill.innerHTML = dotA + '<span class="tie-note">not related (within bounds)</span>';
    } else {
      pill.innerHTML = dotA + "<span>" + ties.map(termSpan).join('<span class="sep">·</span>') + "</span>" +
        (onSwap ? '<span class="swap-mini" data-swap="1" title="swap perspective">⇄</span>' : "");
    }
    stage.appendChild(pill);
    var rb = cardRect(b);
    place(pill, rb.left + rb.width / 2 - pill.offsetWidth / 2, rb.top + rb.height + 8);

    pill.className = "reason-pill q-float";
    pill.innerHTML = "<b>can’t say</b> — " + reasons.join(" · ");

    place(pill, r.left + r.width / 2 - pill.offsetWidth / 2, r.top + r.height + 8);

  /* =============== the filter's three tree stances =============== */
  function paintFilter() {
    var res = runFilter();
    clearPaint();
    if (model.anchor) addClass(model.anchor, "q-anchor-a", "canonical");
    if (!res.preds.length) { applyEditorSim(); return res; }

    if (VARIANT === "3") {
      /* stance C: the filter never paints. A kin set still does — it is a kin
         query, and staying silent about the source would hide where the
         filtered list came from. */
      if (F.scopeKin && model.anchor && model.activeSet) {
        paintResults([model.anchor], setById(model.activeSet).fn(model.anchor));
      }
      applyEditorSim();
      return res;
    }

    res.yes.forEach(function (id) {
      addClass(id, "q-result", "canonical");
      if (GHOSTS[id]) addClass(id, "q-result-ghost", "ghost");
    });
    if (F.mode === "includeUncertain" || F.revealUncertain) {
      res.maybe.forEach(function (id) {

        if (GHOSTS[id]) addClass(id, "q-maybe-ghost", "ghost");
      });
    }
    var shown = res.yes.concat((F.mode === "includeUncertain" || F.revealUncertain) ? res.maybe : []);
    if (VARIANT === "1") {                                    // stance A: dim the rest
      allCards().forEach(function (c) {
        if (shown.indexOf(c.getAttribute("data-person-id")) < 0) c.classList.add("q-dim");
      });
    } else {                                                  // stance B: hide the rest
      allCards().forEach(function (c) {
        if (shown.indexOf(c.getAttribute("data-person-id")) < 0) c.classList.add("q-hide");
      });
    }
    /* the ? mark rides every card the data can't judge */
    if (F.mode === "includeUncertain" || F.revealUncertain) {
      res.maybe.forEach(function (id) {
        var r = cardRect(id);
        if (!r) return;
        var m = document.createElement("div");
        m.className = "maybe-mark";
        m.textContent = "?";

        m.style.left = (r.left + r.width - 8) + "px";
        m.style.top = (r.top - 8) + "px";

  }
  function repaint() {

    renderChrome();
    syncHint();
  }

  /* =============== editor-selection simulation =============== */
  var editorSel = "";

    var o = document.createElement("option");
    o.value = id; o.textContent = P[id].name;
    editorSimEl.appendChild(o);
  });

  function applyEditorSim() {
    allCards().forEach(function (c) { c.classList.remove("kul-selected"); });
    if (!editorSel) return;
    if (querying()) return;   // a filter is a query too — sync stays suspended
    addClass(editorSel, "kul-selected", "canonical");

  function syncHint() {
    var old = stageRow.querySelector(".sync-hint");

      hint.innerHTML = "editor sync paused while querying — <kbd>Esc</kbd> to resume";

  document.getElementById("langSel").addEventListener("change", function () {

  /* =============== the settled model: lens × widget (#276) =============== */
  var model = {
    anchor: null, listOpen: false, activeSet: null, filterOpen: true,

    select: function (id) {
      this.anchor = id; this.activeSet = null;
      removeFloats(); clearPaint();
      addClass(id, "q-anchor-a", "canonical");
      if (filterActive()) paintFilter();
      applyEditorSim();
      renderChrome();
      syncHint();
    },
    clearAll: function () {
      this.anchor = null; this.listOpen = false; this.activeSet = null;
      F.preds = []; F.scopeKin = false; F.revealUncertain = false;
      F.facets = { family: { values: [], absent: false }, gender: { values: [], absent: false },
                   born: { bucket: null, absent: false }, died: { presence: null } };
      removeFloats(); clearPaint(); applyEditorSim(); renderChrome(); syncHint();
    },
    onCardClick: function (id) {
      if (id === this.anchor) return;
      this.select(id);
    },
    onCardHover: function (id, entering) {
      if (!entering) {
        allCards().forEach(function (c) { c.classList.remove("q-anchor-b"); });

          allCards().forEach(function (c) { c.classList.remove("q-path"); });

          pathMids(this.anchor, id, ties).forEach(function (m) { addClass(m, "q-path", "canonical"); });
        }
        whisperAt(this.anchor, id, ties, null, true);

      }
      if (!this.anchor && filterActive()) {             // no selection → the filter whispers instead
        var j = judge(id, activePreds());
        if (j.verdict === U) reasonAt(id, whyUnknown(id, activePreds()));
      }
    },
    runSet: function (sid, quiet) {
      var s = setById(sid);
      var ids = s.fn(this.anchor);
      this.activeSet = sid;
      if (filterActive() && F.scopeKin) { paintFilter(); renderChrome(); return; }
      paintResults([this.anchor], ids);
      if (!ids.length && !quiet) {
        toastAt("No " + s.label.toLowerCase() + " in the recorded facts for " + P[this.anchor].name +
          ". Nothing is guessed — absence stays absence.", cardRect(this.anchor));
      }
      renderChrome();
    }
  };

  /* ==========================================================

  function scopeChipsHtml() {

      (kinOk ? "filter within the painted kin set (kinOf + where)" : "run a kin-set query first") + '">' +
      (kinOk ? firstName(model.anchor) + "’s " + setById(model.activeSet).label.toLowerCase() +

  }
  function valueControl(p, i) {

      return '<select class="val" data-i="' + i + '" data-k="value">' +
        ["", "male", "female", "other"].map(function (g) {

        }).join("") + "</select>";
    }

      return '<input class="val" data-i="' + i + '" data-k="values" placeholder="Rossi, Conti" value="' +

    }

    return '<input class="val" data-i="' + i + '" data-k="value" placeholder="' + ph + '" value="' +
      (p.value || "") + '">';
  }
  function predRowsHtml() {
    /* Two lines per condition: the 272px widget cannot hold field+op+value on

       bug — see the resolution note on hosting the filter in the widget. */
    var rows = F.preds.map(function (p, i) {
      var v = valueControl(p, i);
      return '<div class="f-row"><span class="and">' + (i ? "and" : "where") + "</span>" +
        '<select class="fld" data-i="' + i + '" data-k="field">' + FIELDS.map(function (d) {

  /* ==========================================================
     VARIANT 2 — the chip sentence in stage chrome

  var openPop = null;

  function popAt(anchorEl, html) {

  function renderBar() {
    if (VARIANT !== "2") { bar.innerHTML = ""; return; }
    var res = runFilter();

      '<span class="fchip scope" data-scopechip="1">' + scopeLabel() + " <b>" + res.cands.length + "</b> ▾</span>";
    if (res.preds.length) html += '<span class="kw">where</span>';
    F.preds.forEach(function (p, i) {

        '<span class="fchip pred' + (unknownish ? " unknownish" : "") + '" data-chip="' + i + '">' +

    });

    if (res.preds.length) {

  /* ==========================================================
     VARIANT 3 — the facet rail (click values, no operators)
     ========================================================== */
  var BORN_BUCKETS = [
    { id: "pre1950", label: "before 1950", preds: [{ field: "born", op: "lt", value: "1950" }] },
    { id: "b5079", label: "1950 – 1979", preds: [{ field: "born", op: "gte", value: "1950" }, { field: "born", op: "lt", value: "1980" }] },
    { id: "b80", label: "1980 or later", preds: [{ field: "born", op: "gte", value: "1980" }] }
  ];
  function valuesOf(field) {
    var seen = [];
    ALL.forEach(function (id) {
      var v = recOf(id)[field];
      if (v !== undefined && seen.indexOf(v) < 0) seen.push(v);
    });
    return seen.sort();
  }
  function facetPreds(skip) {
    var out = [];
    ["family", "gender"].forEach(function (f) {
      if (skip === f) return;
      var st = F.facets[f];
      if (st.absent) out.push({ field: f, op: "absent" });
      else if (st.values.length === 1) out.push({ field: f, op: "eq", value: st.values[0] });
      else if (st.values.length > 1) out.push({ field: f, op: "in", values: st.values.slice() });
    });
    if (skip !== "born") {
      var b = F.facets.born;
      if (b.absent) out.push({ field: "born", op: "absent" });
      else if (b.bucket) {
        BORN_BUCKETS.filter(function (k) { return k.id === b.bucket; })[0].preds.forEach(function (p) { out.push(p); });
      }
    }
    if (skip !== "died" && F.facets.died.presence) {
      out.push({ field: "died", op: F.facets.died.presence });
    }
    return out;
  }
  /* faceted counts: every other facet applied, then this value tested */
  function facetCount(field, testPreds) {
    var base = facetPreds(field), yes = 0, maybe = 0;
    candidateIds().forEach(function (id) {
      var j = judge(id, base.concat(testPreds));
      if (j.verdict === T) yes++;
      else if (j.verdict === U) maybe++;
    });
    return { yes: yes, maybe: maybe };
  }
  function fvHtml(on, label, count, data, opts) {
    opts = opts || {};
    return '<div class="fv' + (on ? " on" : "") + (count.yes + count.maybe === 0 ? " dead" : "") + '" ' + data + ">" +
      '<span class="box' + (opts.radio ? " radio" : "") + '"></span>' +
      '<span class="lab' + (opts.abs ? " abs" : "") + '">' + label + "</span>" +
      '<span class="n">' + count.yes + (count.maybe ? ' <span class="q" title="' + count.maybe +
        ' more the records can’t judge">?' + count.maybe + "</span>" : "") + "</span></div>";
  }
  function whereWords() {
    var preds = facetPreds();
    if (!preds.length) return '<span class="none">no conditions — everyone shown</span>';
    return "<b>where</b> " + preds.map(predLabel).join(" <b>and</b> ");
  }
  function renderRail() {
    if (VARIANT !== "3") { rail.innerHTML = ""; return; }
    var res = runFilter();
    var html = '<div class="rail-head">Filter by attributes<span class="n">' + res.shown.length + " / " +
      res.cands.length + "</span></div>";

    html += '<div class="facet"><h4>Within</h4>' +
      fvHtml(!F.scopeKin, "Everyone", { yes: ALL.length, maybe: 0 }, 'data-scope="all"', { radio: true });
    if (model.anchor && model.activeSet) {
      html += fvHtml(F.scopeKin, firstName(model.anchor) + "’s " + setById(model.activeSet).label.toLowerCase(),
        { yes: setById(model.activeSet).fn(model.anchor).length, maybe: 0 }, 'data-scope="kin"', { radio: true });
    }
    html += "</div>";

    ["family", "gender"].forEach(function (f) {
      html += '<div class="facet"><h4>' + f + "</h4>";
      valuesOf(f).forEach(function (v) {
        var on = F.facets[f].values.indexOf(v) >= 0;
        html += fvHtml(on, v, facetCount(f, [{ field: f, op: "eq", value: v }]),
          'data-facet="' + f + '" data-val="' + v + '"');
      });
      html += fvHtml(F.facets[f].absent, "not recorded", facetCount(f, [{ field: f, op: "absent" }]),
        'data-facet="' + f + '" data-abs="1"', { abs: true });
      html += "</div>";
    });

    html += '<div class="facet"><h4>born<span class="single" title="Two ranges at once would need OR — the engine has none, permanently">one range only</span></h4>';
    BORN_BUCKETS.forEach(function (b) {
      html += fvHtml(F.facets.born.bucket === b.id, b.label, facetCount("born", b.preds),
        'data-born="' + b.id + '"', { radio: true });
    });
    html += fvHtml(F.facets.born.absent, "not recorded", facetCount("born", [{ field: "born", op: "absent" }]),
      'data-born="absent"', { radio: true, abs: true });
    html += "</div>";

    html += '<div class="facet"><h4>died</h4>' +
      fvHtml(F.facets.died.presence === "present", "recorded", facetCount("died", [{ field: "died", op: "present" }]),
        'data-died="present"', { radio: true }) +
      fvHtml(F.facets.died.presence === "absent", "not recorded", facetCount("died", [{ field: "died", op: "absent" }]),
        'data-died="absent"', { radio: true, abs: true }) +
      '<div class="f-note" style="padding:4px 0 0 0">“died not recorded” is <b>not</b> “living” — the engine ' +
      "reports the record, never a guess.</div></div>";

    html += '<div class="where-line">' + whereWords() + "</div>";

    /* the results list — the only place a sort can land */
    html += '<div class="rail-res"><h4>Matches</h4>' +
      '<div class="f-sortline">sort ' +
      '<select data-sortfield="1"><option value="">— none —</option>' +
      FIELDS.map(function (d) {
        return '<option value="' + d.f + '"' + (F.sort && F.sort.field === d.f ? " selected" : "") + ">" + d.label + "</option>";
      }).join("") + "</select>" +
      '<select data-sortdir="1"' + (F.sort ? "" : " disabled") + '>' +
      '<option value="asc"' + (F.sort && F.sort.dir === "asc" ? " selected" : "") + ">asc</option>" +
      '<option value="desc"' + (F.sort && F.sort.dir === "desc" ? " selected" : "") + ">desc</option>" +
      "</select>" + (F.sort ? "<span>· missing last</span>" : "") + "</div>";

    var listed = sortIds(res.shown, F.sort);
    if (!listed.length) {
      html += '<div class="rail-empty">Nothing matches. That is an answer, not an error — nothing is guessed.</div>';
    } else {
      listed.forEach(function (id) {
        var j = judge(id, res.preds), isMaybe = j.verdict === U;
        var meta = F.sort ? (recOf(id)[F.sort.field] === undefined ? "—" : recOf(id)[F.sort.field]) : "";
        html += '<div class="rrow' + (isMaybe ? " maybe" : "") + '" data-pick="' + id + '">' +
          (isMaybe ? '<span class="qm">?</span>' : "") +
          '<span class="rn">' + P[id].name +
          (isMaybe ? '<span class="why">' + whyUnknown(id, res.preds)[0] + "</span>" : "") +
          '</span><span class="meta">' + meta + "</span></div>";
      });
    }
    if (F.mode === "certain" && res.maybe.length) {
      html += '<div class="excl-fold"><b>' + res.maybe.length + "</b> more can’t be judged from the records " +
        "— excluded, not absent:<br>" +
        res.maybe.map(function (id) { return firstName(id) + " (" + whyUnknown(id, res.preds)[0] + ")"; }).join("; ") +
        ' <u data-mode="includeUncertain">include them</u></div>';
    }
    html += "</div>";
    rail.innerHTML = html;
  }

  /* =============== the right-edge widget =============== */
  function renderWidget() {
    var self = model, a = model.anchor;
    var old = stageRow.querySelector(".pop"); if (old) old.remove();
    var showFilter = VARIANT === "1";
    if (!a && !showFilter) return;
    var res = runFilter();
    var pop = document.createElement("div");
    pop.className = "pop";
    var head = '<div class="pop-head"><span class="pop-crumb">' +
      (a ? P[a].name : "Everyone · " + ALL.length + " people") + "</span>" +
      '<span class="pop-close" data-close="1">✕</span></div>';
    var body = a ? '<div class="pop-body">' + detailHtml(a) + "</div>" : "";
    var kin = "";
    if (a) {
      var kinArr = model.listOpen ? "▾" : "▸";
      var listHtml = "";
      if (model.listOpen) {
        listHtml = '<div class="kin-list">' + KIN_SETS.map(function (s) {
          var n = s.fn(a).length;
          var on = model.activeSet === s.id;
          return '<div class="kin-row' + (on ? " on" : "") + '" data-set="' + s.id + '">' + s.label +
            '<span class="cnt' + (n ? "" : " zero") + '">' + n + "</span></div>";
        }).join("") + "</div>";
      }
      kin = '<div class="plate-section"><div class="plate-sec-head" data-togglelist="1">Explore kin' +
        '<span class="arr">' + kinArr + "</span></div>" + listHtml + "</div>";
    }
    var filt = showFilter ? filterSectionHtml(res) : "";
    var hint = a ? '<div class="lens-hint">the <b>lens</b> is live: hover anyone to read your tie · click a person to select them</div>'
                 : '<div class="lens-hint">no one selected — hover a <b>?</b> card to hear why the records can’t judge it</div>';
    pop.innerHTML = head + body + kin + filt + hint;
    stageRow.appendChild(pop);

    pop.addEventListener("click", function (ev) {
      var el = ev.target.closest("[data-close],[data-togglelist],[data-set],[data-togglefilter],[data-add],[data-rm],[data-scope],[data-mode],[data-reveal]");
      ev.stopPropagation();
      if (!el) return;
      if (el.hasAttribute("data-close")) { model.clearAll(); return; }
      if (el.hasAttribute("data-togglelist")) { model.listOpen = !model.listOpen; renderChrome(); return; }
      if (el.hasAttribute("data-togglefilter")) { model.filterOpen = !model.filterOpen; renderChrome(); return; }
      if (el.hasAttribute("data-set")) { model.runSet(el.getAttribute("data-set")); return; }
      if (el.hasAttribute("data-add")) { addPred(); return; }
      if (el.hasAttribute("data-rm")) { F.preds.splice(+el.getAttribute("data-rm"), 1); repaint(); return; }
      if (el.hasAttribute("data-scope")) {
        if (el.classList.contains("off")) return;
        F.scopeKin = el.getAttribute("data-scope") === "kin"; repaint(); return;
      }
      if (el.hasAttribute("data-mode")) { F.mode = el.getAttribute("data-mode"); F.revealUncertain = false; repaint(); return; }
      if (el.hasAttribute("data-reveal")) { F.revealUncertain = !F.revealUncertain; repaint(); return; }
    });
    pop.addEventListener("change", function (ev) { onPredEdit(ev.target); });
    pop.addEventListener("input", function (ev) {
      if (ev.target.tagName === "INPUT") onPredEdit(ev.target, true);
    });
  }
  function addPred() {
    F.preds.push({ field: "family", op: "eq", value: "" });
    repaint();
    var inputs = stageRow.querySelectorAll(".f-rows .val");
    var inp = inputs[inputs.length - 1];
    if (inp && inp.focus) inp.focus();
  }
  function onPredEdit(el, live) {
    var i = el.getAttribute && el.getAttribute("data-i");
    if (i === null || i === undefined) return;
    var p = F.preds[+i], k = el.getAttribute("data-k");
    if (k === "field") {
      p.field = el.value;
      if (opsFor(p.field).indexOf(p.op) < 0) p.op = "eq";
      if (p.op === "in" && fieldDef(p.field).date) p.op = "eq";
    } else if (k === "op") {
      p.op = el.value;
    } else if (k === "values") {
      p.values = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    } else {
      p.value = el.value;
    }
    /* Typing must not rebuild the widget — that would steal focus every
       keystroke. Repaint the tree, patch the counters in place. */
    if (live) { paintFilter(); patchCounters(); syncHint(); return; }
    repaint();
  }
  function patchCounters() {
    var res = runFilter();
    var pop = stageRow.querySelector(".pop");
    if (!pop) return;
    var tally = pop.querySelector(".f-tally");
    if (tally) {
      var holder = document.createElement("div");
      holder.innerHTML = tallyHtml(res);
      tally.replaceWith(holder.firstElementChild);
    }
    var head = pop.querySelector("[data-togglefilter]");
    if (head) {
      var pip = head.querySelector(".pip");
      if (res.preds.length) {
        if (!pip) { pip = document.createElement("span"); pip.className = "pip"; head.insertBefore(pip, head.querySelector(".arr")); }
        pip.textContent = res.shown.length;
      } else if (pip) { pip.remove(); }
    }
  }

  /* =============== variant-2 bar interactions =============== */

          : "") + "</div>" +

      mp.addEventListener("click", function (e) {

    }
    if (el.hasAttribute("data-chip")) {

      var vc = needsValue(p.op)
        ? (p.field === "gender"
            ? '<select data-i="' + i + '" data-k="value">' + ["", "male", "female", "other"].map(function (g) {
                return '<option value="' + g + '"' + (p.value === g ? " selected" : "") + ">" + (g || "—") + "</option>";
              }).join("") + "</select>"
            : '<input data-i="' + i + '" data-k="' + (p.op === "in" ? "values" : "value") + '" value="' +
              (p.op === "in" ? (p.values || []).join(", ") : (p.value || "")) + '" placeholder="' +
              (fieldDef(p.field).date ? "1950 · 1950-04 · ~1950" : "exact") + '">')
        : "";
      var cp = popAt(el, '<div class="r">' +
        '<select data-i="' + i + '" data-k="field">' + FIELDS.map(function (d) {
          return '<option value="' + d.f + '"' + (p.field === d.f ? " selected" : "") + ">" + d.label + "</option>";
        }).join("") + "</select>" +
        '<select data-i="' + i + '" data-k="op">' + opsFor(p.field).map(function (o) {
          return '<option value="' + o + '"' + (p.op === o ? " selected" : "") + ">" + OPS[o] + "</option>";
        }).join("") + "</select>" + vc + "</div>" +
        (fieldDef(p.field).date ? '<div class="hint">partial dates are whole periods; <b>~</b> is ±5 years — either can make a person a <b>can’t say</b></div>' : ""));
      cp.addEventListener("change", function (e) { onBarPredEdit(e.target, el); });
      cp.addEventListener("input", function (e) { if (e.target.tagName === "INPUT") onBarPredEdit(e.target, el, true); });
      var fi = cp.querySelector("input");
      if (fi) fi.focus();
      return;
    }
  });
  function onBarPredEdit(el, chipEl, live) {
    var i = el.getAttribute("data-i");
    if (i === null) return;
    var p = F.preds[+i], k = el.getAttribute("data-k");
    if (k === "field") {
      p.field = el.value;
      if (opsFor(p.field).indexOf(p.op) < 0) p.op = "eq";
    } else if (k === "op") { p.op = el.value; }
    else if (k === "values") { p.values = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean); }
    else { p.value = el.value; }
    if (live) {                        // repaint the tree, leave the popover alone
      paintFilter();
      renderBarTallyOnly();
      if (chipEl) {                    // keep the sentence honest while typing
        chipEl.innerHTML = predLabel(p) + ' <span class="x" data-rm="' + i + '">✕</span>';
      }
      syncHint();
      return;
    }
    closePop(); repaint();
    var chips = bar.querySelectorAll("[data-chip]");
    if (chips[+i]) chips[+i].click();
  }
  function renderBarTallyOnly() {
    var res = runFilter();
    var tally = bar.querySelector(".fbar-tally");
    if (!tally) return;
    var hidden = res.cands.length - res.shown.length;
    tally.innerHTML = '<span class="num">' + res.shown.length + " of " + res.cands.length + "</span>" +
      (res.preds.length ? '<span class="hidden-note">' + hidden + " hidden" +
        (F.mode === "certain" && res.maybe.length ? " · " + res.maybe.length + " can’t say" : "") +
        ' · <u data-clear="1">clear</u></span>' : "");
  }

  /* =============== rail interactions =============== */
  rail.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-facet],[data-born],[data-died],[data-scope],[data-pick],[data-mode]");
    if (!el) return;
    if (el.hasAttribute("data-scope")) { F.scopeKin = el.getAttribute("data-scope") === "kin"; repaint(); return; }
    if (el.hasAttribute("data-mode")) { F.mode = el.getAttribute("data-mode"); repaint(); return; }
    if (el.hasAttribute("data-pick")) { model.select(el.getAttribute("data-pick")); return; }
    if (el.hasAttribute("data-facet")) {
      var f = el.getAttribute("data-facet"), st = F.facets[f];
      if (el.hasAttribute("data-abs")) { st.absent = !st.absent; if (st.absent) st.values = []; }
      else {
        var v = el.getAttribute("data-val"), at = st.values.indexOf(v);
        if (at >= 0) st.values.splice(at, 1); else { st.values.push(v); st.absent = false; }
      }
      repaint(); return;
    }
    if (el.hasAttribute("data-born")) {
      var b = el.getAttribute("data-born"), st2 = F.facets.born;
      if (b === "absent") { st2.absent = !st2.absent; if (st2.absent) st2.bucket = null; }
      else { st2.bucket = st2.bucket === b ? null : b; st2.absent = false; }
      repaint(); return;
    }
    if (el.hasAttribute("data-died")) {
      var d = el.getAttribute("data-died");
      F.facets.died.presence = F.facets.died.presence === d ? null : d;
      repaint(); return;
    }
  });
  rail.addEventListener("change", function (ev) {
    if (ev.target.hasAttribute("data-sortfield")) {
      F.sort = ev.target.value ? { field: ev.target.value, dir: (F.sort && F.sort.dir) || "asc" } : null;
      renderChrome(); return;
    }
    if (ev.target.hasAttribute("data-sortdir") && F.sort) {
      F.sort.dir = ev.target.value; renderChrome(); return;
    }
  });
  /* hovering a result row pulses its card — the list↔tree tether stance C needs */
  rail.addEventListener("mouseover", function (ev) {
    var row = ev.target.closest("[data-pick]");
    if (!row) return;
    allCards().forEach(function (c) { c.classList.remove("q-pulse"); });
    addClass(row.getAttribute("data-pick"), "q-pulse", "canonical");
  });
  rail.addEventListener("mouseleave", function () {
    allCards().forEach(function (c) { c.classList.remove("q-pulse"); });
  });

  /* =============== variants + chrome =============== */
  var VARIANTS = [
    { key: "1", name: "Widget stack", sub: "predicate rows in the details widget · non-matches DIMMED" },
    { key: "2", name: "Filter bar", sub: "a chip sentence above the tree · non-matches HIDDEN" },
    { key: "3", name: "Facet rail", sub: "click values, no operators · tree UNTOUCHED + results list" }
  ];
  var EXPLAIN = {
    "1": [["Where it lives", "Inside the <b>right-edge details widget</b> — the surface #276 designated as growable. The widget now stands even with nobody selected (“Everyone · 10 people”)."],
          ["Input shape", "Stacked <b>field / op / value</b> rows with an explicit <b>and</b> gutter, so conjunction-only is visible in the grammar. Ops are field-aware; ∈ takes a comma list."],
          ["Certainty", "A <b>segmented control</b> plus a standing disclosure: “N more can’t be judged — excluded, not absent”, with a <u>peek</u>. Can’t-say cards paint <b>amber dashed with a ?</b>."],
          ["The tree", "Matches glow teal; <b>everyone else dims</b> — the same paint vocabulary kin sets already use."]],
    "2": [["Where it lives", "<b>Stage chrome</b>, above the tree — independent of selection, always visible, reads left-to-right as a sentence."],
          ["Input shape", "A <b>chip sentence</b>: <i>Showing Everyone where family = Rossi and born &lt; 1950</i>. Each chip opens a small editor; <b>+</b> picks a field. The <b>and</b> keywords are literal text."],
          ["Certainty", "A <b>chip inside the sentence</b> (“certain” / “certain + can’t say”) — the third truth value is part of the query, not a view option."],
          ["The tree", "Non-matches are <b>hidden outright</b> — watch the holes it punches in the canonical layout, and the edges that now lead nowhere."]],
    "3": [["Where it lives", "A <b>left facet rail</b>, mirroring the right-edge widget — browse, don’t build."],
          ["Input shape", "<b>No operators at all.</b> Click values; counts are faceted and live. Multi-select inside a text facet becomes <b>∈</b> (the engine’s one any-of); date ranges stay <b>single-select</b>, because two ranges would need OR. The plain-words <i>where</i> line shows what you built."],
          ["Certainty", "Every facet carries a <b>“not recorded”</b> row (the <i>absent</i> predicate) and a <b>?n</b> superscript counting who can’t be judged. Excluded people are named with reasons, not silently dropped."],
          ["The tree", "<b>Untouched.</b> Results live in the rail’s list — hover a row to pulse its card, click to select. This is also the only variant where <b>sort</b> means anything."]]
  };
  var VARIANT = "1";
  function readVariant() {
    var m = /[?&]variant=([123])/.exec(location.search);
    return m ? m[1] : "1";
  }
  function setVariant(v, push) {
    VARIANT = v;
    root.className = "v" + v;
    var meta = VARIANTS.filter(function (x) { return x.key === v; })[0];
    document.getElementById("protoBadge").textContent = "PROTOTYPE · ROUND 10 · VARIANT " + v;
    document.getElementById("exSummary").innerHTML = "Variant " + v + " — <b>" + meta.name + "</b>";
    document.getElementById("exBody").innerHTML = "<dl>" + EXPLAIN[v].map(function (r) {
      return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>";
    }).join("") + "</dl>";
    var lbl = document.querySelector(".varbar .vlabel");
    if (lbl) lbl.innerHTML = v + " — <b>" + meta.name + "</b> · " + meta.sub;
    if (push && history.replaceState) {
      history.replaceState(null, "", location.pathname + "?variant=" + v + location.hash);
    }
    closePop();
    repaint();
  }
  function renderChrome() {
    renderWidget();
    renderBar();
    renderRail();
  }

  /* the throwaway switcher — never ships (this whole file is a prototype) */
  var vb = document.createElement("div");
  vb.className = "varbar";
  vb.innerHTML = '<button data-step="-1" title="previous variant">‹</button>' +
    '<span class="vlabel"></span><button data-step="1" title="next variant">›</button>';
  document.body.appendChild(vb);
  vb.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-step]");
    if (!b) return;
    var i = VARIANTS.map(function (x) { return x.key; }).indexOf(VARIANT);
    var n = (i + (+b.getAttribute("data-step")) + VARIANTS.length) % VARIANTS.length;
    setVariant(VARIANTS[n].key, true);
  });

  /* =============== wire the SVG =============== */
  allCards().forEach(function (card) {
    card.addEventListener("click", function (ev) {
      model.onCardClick(card.getAttribute("data-person-id"), ev);
      ev.stopPropagation();
    });
    card.addEventListener("mouseenter", function () {
      model.onCardHover(card.getAttribute("data-person-id"), true);
    });
    card.addEventListener("mouseleave", function () {
      model.onCardHover(card.getAttribute("data-person-id"), false);
    });
  });
  svg.addEventListener("click", function () { model.clearAll(); });
  document.addEventListener("click", function () { closePop(); });
  document.addEventListener("keydown", function (ev) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typing = /INPUT|TEXTAREA|SELECT/.test(tag) ||
      (document.activeElement && document.activeElement.isContentEditable);
    if (ev.key === "Escape") { closePop(); model.clearAll(); return; }
    if (typing) return;
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      var i = VARIANTS.map(function (x) { return x.key; }).indexOf(VARIANT);
      var n = (i + (ev.key === "ArrowRight" ? 1 : -1) + VARIANTS.length) % VARIANTS.length;
      setVariant(VARIANTS[n].key, true);
    }
  });

  setVariant(readVariant(), false);
})();
</script>
<!--BODY-END-->
</body>
</html>
