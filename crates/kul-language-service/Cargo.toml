[package]
name = "kul-language-service"
description = "Language features for Kul source (hover, completion, navigation, rename, tokens, formatting) as pure functions over a checked project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Derive `tsify::Tsify` on the result types so `kul-wasm` can emit their
# TypeScript declarations from this source of truth. Default-off; see ADR-0012.
tsify = ["dep:tsify", "dep:wasm-bindgen", "kul-core/tsify"]

[dependencies]
kul-core = { workspace = true }
serde = { workspace = true }
tsify = { workspace = true, optional = true, features = ["js"] }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
serde_json = { workspace = true }
